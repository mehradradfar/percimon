<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Persimon Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: screen navigator on the left, one iPhone-sized prototype on a quiet canvas; on phones the prototype runs full-screen. */
:root{
  --bg:#E9E9EE; --panel:#F7F7F9; --fg:#1C1C1E; --muted:#6C6C72; --line:#D6D6DC; --accent:#89341C;
  --hot:rgba(228,87,46,.85);
  --sf:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;
  --sfd:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.32,.72,0,1); --spring:cubic-bezier(.34,1.36,.64,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111113;--panel:#1A1A1D;--fg:#ECECF0;--muted:#9C9CA3;--line:#2C2C30;--accent:#F2AB97;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111113;--panel:#1A1A1D;--fg:#ECECF0;--muted:#9C9CA3;--line:#2C2C30;--accent:#F2AB97;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sf);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--hot);outline-offset:2px}

/* ---------- shell ---------- */
.app{height:100%;box-sizing:border-box;display:grid;grid-template-columns:minmax(236px,284px) minmax(0,1fr);gap:24px;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side{background:var(--panel);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.side-head{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;letter-spacing:-.01em}
.brand svg{width:22px;height:22px}
.side-head p{margin:0;font-size:13px;color:var(--muted)}
.side-head .close{display:none}
.ctrls{display:flex;flex-wrap:wrap;gap:10px 14px;padding:12px 20px;border-bottom:1px solid var(--line);align-items:center;justify-content:space-between}
.switch{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;user-select:none}
.switch input{appearance:none;width:30px;height:18px;border-radius:9px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .15s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s}
.switch input:checked{background:#34C759}
.switch input:checked::after{transform:translateX(12px)}
.restart{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);padding:6px 8px;border-radius:8px}
.restart:hover{color:var(--fg);background:var(--bg)}
.list{overflow-y:auto;padding:6px 12px 12px;flex:1;min-height:0}
.flow{margin-top:12px}
.flow h4{margin:0 8px 4px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.scr{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border-radius:9px;font-size:14px}
.scr:hover{background:var(--bg)}
.scr .code{font-family:var(--mono);font-size:11px;color:var(--muted);width:24px;font-variant-numeric:tabular-nums}
.scr .kind{margin-left:auto;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.scr.on{background:var(--bg);font-weight:600}
.scr.on .code{color:var(--accent)}
.states{display:flex;flex-wrap:wrap;gap:4px;padding:2px 8px 8px 42px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;line-height:1;padding:5px 8px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--line)}
.st:hover{color:var(--fg)}
.st.on{color:var(--fg);box-shadow:inset 0 0 0 1px var(--accent)}
.st.on::before{background:var(--accent)}
.side-foot{margin:0;padding:12px 20px 16px;border-top:1px solid var(--line);font-size:12px;line-height:1.5;color:var(--muted)}
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;min-width:0;min-height:0}
#wrap{position:relative;flex:none;width:393px;height:852px}
.caption{display:flex;align-items:center;gap:14px;font-size:14px}
.caption .code{font-family:var(--mono);font-size:12px;color:var(--accent)}
.caption .sec{color:var(--muted)}
.step{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.step:hover{color:var(--fg);border-color:var(--muted)}
.navopen-btn{display:none}

/* ---------- phone: iOS-style, Persimon tint ---------- */
.phone{
 --tint:#89341C; --tint-fill:#89341C; --on-tint:#fff; --tint-soft:rgba(137,52,28,.11); --accent:#E4572E;
 --bg:#FFFFFF; --grouped:#F2F2F7; --cell:#FFFFFF; --sheet:#F2F2F7; --sheet-cell:#FFFFFF;
 --label:#000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3);
 --sep:rgba(60,60,67,.24); --fill:rgba(118,118,128,.12); --fill2:rgba(120,120,128,.2);
 --gray5:#E5E5EA; --gray4:#D1D1D6; --bubble:#E9E9EB; --thumb:#FFFFFF; --hl:rgba(0,0,0,.05);
 --glass:rgba(255,255,255,.7); --glass2:rgba(250,250,252,.86); --bar:rgba(250,250,252,.8); --glass-edge:rgba(255,255,255,.75);
 --green:#34C759; --red:#FF3B30; --orange:#FF9500;
 --sbh:54px; --hb:34px;
 position:absolute;top:0;left:0;width:393px;height:852px;transform-origin:top left;border-radius:55px;overflow:hidden;background:#000;color:var(--label);
 font-family:var(--sf);font-size:17px;line-height:1.3;letter-spacing:-.008em;-webkit-font-smoothing:antialiased;
 box-shadow:0 0 0 11px #0c0c0e,0 0 0 12.5px #3a3a3e,0 32px 80px rgba(20,8,4,.35);color-scheme:light;isolation:isolate;user-select:none;-webkit-user-select:none
}
.phone.dark{
 --tint:#F2AB97; --tint-fill:#A9553E; --on-tint:#fff; --tint-soft:rgba(242,171,151,.15); --accent:#F06A42;
 --bg:#000; --grouped:#000; --cell:#1C1C1E; --sheet:#1C1C1E; --sheet-cell:#2C2C2E;
 --label:#fff; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3);
 --sep:rgba(84,84,88,.6); --fill:rgba(118,118,128,.24); --fill2:rgba(120,120,128,.36);
 --gray5:#2C2C2E; --gray4:#3A3A3C; --bubble:#26252A; --thumb:#636366; --hl:rgba(255,255,255,.08);
 --glass:rgba(44,44,46,.66); --glass2:rgba(36,36,38,.88); --bar:rgba(18,18,20,.8); --glass-edge:rgba(255,255,255,.14);
 --green:#30D158; --red:#FF453A; --orange:#FF9F0A;
 color-scheme:dark
}
.phone *{box-sizing:border-box}
.phone p,.phone h1,.phone h2,.phone h3{margin:0}
.phone input,.phone textarea{user-select:text;-webkit-user-select:text}
.phone svg.ic{flex:none;display:block}
#app{position:absolute;inset:0;overflow:hidden;background:var(--bg);transform-origin:50% 0;transition:transform .5s var(--ease),border-radius .5s var(--ease),filter .5s}
.phone.sheet-open #app{transform:translateY(8px) scale(.915);border-radius:16px;filter:brightness(.82)}
.phone.dark.sheet-open #app{filter:brightness(.6)}
#stack{position:absolute;inset:0}
.screen{position:absolute;inset:0;background:var(--bg);overflow:hidden;transition:transform .48s var(--ease)}
.screen.grouped{background:var(--grouped)}
.screen.enter-r{transform:translateX(100%)}
.screen.exit-l{transform:translateX(-28%)}
.screen::after{content:"";position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .48s var(--ease);z-index:30}
.screen.exit-l::after{opacity:calc(.14 * var(--dim,1))}
.screen.cur{box-shadow:-10px 0 30px rgba(0,0,0,.06)}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:calc(var(--sbh) + 44px) 0 44px;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{display:none}
.screen.tallnav .scroll{padding-top:calc(var(--sbh) + 72px)}
.screen.no-nav .scroll{padding-top:calc(var(--sbh) + 6px)}
.screen.has-tab .scroll{padding-bottom:118px}
.screen.has-bottom .scroll{padding-bottom:124px}
.screen.has-composer .scroll{padding-bottom:132px}

/* nav bar */
.nav{position:absolute;top:0;left:0;right:0;z-index:10;height:calc(var(--sbh) + 52px);padding:var(--sbh) 12px 8px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;transition:background .25s,box-shadow .25s}
.screen.tallnav .nav{height:calc(var(--sbh) + 72px)}
.screen.scrolled .nav{background:var(--bar);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);box-shadow:0 .5px 0 var(--sep)}
.nav-t{font-size:17px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px;transition:opacity .2s}
.screen.large .nav-t,.screen.hero .nav-t{opacity:0}
.screen.large.scrolled .nav-t,.screen.hero.scrolled .nav-t{opacity:1}
.nav-l,.nav-r{display:flex;align-items:center;gap:8px}
.nav-r{justify-self:end}
.gbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);box-shadow:inset 0 1px 0 var(--glass-edge),0 2px 12px rgba(0,0,0,.08),0 0 0 .5px rgba(0,0,0,.06);color:var(--label);transition:transform .15s}
.gbtn:active{transform:scale(.92)}
.gbtn.on{color:var(--accent)}
.nbtn{height:44px;padding:0 16px;border-radius:22px;display:inline-flex;align-items:center;font-size:17px;font-weight:500;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);box-shadow:inset 0 1px 0 var(--glass-edge),0 2px 12px rgba(0,0,0,.08),0 0 0 .5px rgba(0,0,0,.06)}
.nbtn.bold{font-weight:600;color:var(--tint)}
.nbtn[disabled]{color:var(--label3);pointer-events:none}
.lt-wrap{padding:0 16px 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-size:13px;font-weight:600;color:var(--label2);letter-spacing:.01em;margin-bottom:1px}
.lt{font-family:var(--sfd);font-size:34px;line-height:41px;font-weight:700;letter-spacing:-.022em}
.avbtn{width:38px;height:38px;border-radius:50%;background:var(--tint-soft);color:var(--tint);display:grid;place-items:center;font-size:15px;font-weight:600;margin-bottom:3px;flex:none}

/* type */
.t1{font-family:var(--sfd);font-size:28px;line-height:34px;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.t2{font-family:var(--sfd);font-size:22px;line-height:28px;font-weight:700;letter-spacing:-.016em}
.hl{font-size:17px;font-weight:600}
.fn{font-size:13px;line-height:18px}
.sec{color:var(--label2)}
.tint{color:var(--tint)}
.c{text-align:center}
.num{font-variant-numeric:tabular-nums}
.big{font-family:var(--sfd);font-size:34px;line-height:41px;font-weight:700;letter-spacing:-.022em;text-wrap:balance}
.lead{font-size:17px;line-height:23px;color:var(--label2);margin-top:8px}
.pad{padding:0 16px}

/* buttons */
.btn{height:52px;width:100%;border-radius:26px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:600;flex:none;transition:transform .15s,opacity .15s,background .25s}
.btn:active{transform:scale(.97);opacity:.85}
.btn.filled{background:var(--tint-fill);color:var(--on-tint)}
.btn.tinted{background:var(--tint-soft);color:var(--tint)}
.btn.gray{background:var(--fill);color:var(--label)}
.btn.plain{color:var(--tint);height:44px}
.btn.sm{height:34px;width:auto;padding:0 15px;font-size:15px;border-radius:17px}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.loading,.btn.done{pointer-events:none}
.btn.done{background:var(--green);color:#fff}
.link{color:var(--tint);font-weight:500}

/* grouped lists */
.group{margin:0 16px 30px}
.ghead{font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:.02em;padding:0 16px 7px}
.ghead.lg{font-size:20px;font-weight:700;color:var(--label);text-transform:none;letter-spacing:-.01em;padding:0 4px 8px}
.gfoot{font-size:13px;line-height:18px;color:var(--label2);padding:7px 16px 0}
.gcard{background:var(--cell);border-radius:22px;overflow:hidden}
.sheet .gcard{background:var(--sheet-cell)}
.row{display:flex;align-items:center;gap:12px;min-height:52px;width:100%;padding:10px 16px;position:relative;text-align:left;font-size:17px;background:transparent;transition:background .15s}
.row+.row::before,.rcell+.rcell::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.row.has-ic+.row.has-ic::before{left:58px}
button.row:active,.rcell:active,.icell:active{background:var(--hl)}
.row .lab{flex:1;min-width:0;line-height:22px}
.row .lab small{display:block;font-size:13px;line-height:17px;color:var(--label2)}
.row .val{color:var(--label2);text-align:right;white-space:nowrap}
.row .chev{color:var(--label3);margin-right:-4px}
.row.action .lab{color:var(--tint)}
.row.danger .lab{color:var(--red);text-align:center}
.rico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.rico.ghost{background:none!important;color:var(--tint)}
.cellpad{padding:14px 16px}
.cellpad+.row::before,.row+.cellpad{border-top:.5px solid var(--sep)}

/* segmented, chips, fields */
.segwrap{padding:0 16px 18px}
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:36px;padding:2px;border-radius:18px;background:var(--fill)}
.seg .thumb{position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px) / var(--n));transform:translateX(calc(100% * var(--i)));border-radius:16px;background:var(--thumb);box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);transition:transform .32s var(--ease)}
.seg button{position:relative;z-index:1;font-size:14px;font-weight:500;text-align:center;color:var(--label)}
.seg button.on{font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{height:36px;padding:0 15px;border-radius:18px;background:var(--fill);font-size:15px;font-weight:500;display:inline-flex;align-items:center;gap:6px;flex:none;white-space:nowrap;transition:background .2s,color .2s,transform .15s}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--tint-fill);color:var(--on-tint)}
.tf input,.tf textarea{width:100%;height:56px;border-radius:16px;background:var(--fill);border:0;padding:0 18px;font:inherit;font-size:19px;color:var(--label);outline:none;transition:box-shadow .2s}
.tf input:focus,.tf textarea:focus{box-shadow:0 0 0 2px var(--tint)}
.tf input::placeholder,.tf textarea::placeholder,.cellin::placeholder{color:var(--label3)}
.flabel{font-size:15px;font-weight:600;margin:26px 0 10px}
.searchbar{display:flex;align-items:center;gap:7px;height:42px;border-radius:21px;background:var(--fill);color:var(--label2);padding:0 13px;margin:0 16px 18px;font-size:17px;width:calc(100% - 32px);text-align:left}
.searchbar input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--label);outline:none}
.searchbar input::placeholder{color:var(--label2)}
.searchrow{display:flex;align-items:center;gap:12px;padding:0 16px 16px}
.searchrow .searchbar{margin:0;flex:1;width:auto;min-width:0}
.searchrow .link{flex:none}
.cellin{width:100%;border:0;background:transparent;font:inherit;font-size:17px;color:var(--label);outline:none;resize:none;line-height:22px}
.switch-ios{width:51px;height:31px;border-radius:16px;background:var(--fill2);position:relative;flex:none;transition:background .25s}
.switch-ios::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .28s var(--ease)}
.switch-ios.on{background:var(--green)}
.switch-ios.on::after{transform:translateX(20px)}
.stepper{display:inline-flex;align-items:center;height:32px;border-radius:9px;background:var(--fill);flex:none}
.stepper button{width:46px;height:32px;display:grid;place-items:center;color:var(--label)}
.stepper button+button{border-left:.5px solid var(--sep)}

/* discover */
.today{position:relative;display:block;margin:0 16px 26px;height:340px;width:calc(100% - 32px);border-radius:26px;overflow:hidden;background:#333 center/cover;color:#fff;text-align:left;box-shadow:0 14px 34px rgba(0,0,0,.18);transition:transform .3s var(--ease)}
.today:active{transform:scale(.97)}
.today::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.42) 0%,rgba(0,0,0,0) 34%,rgba(0,0,0,0) 56%,rgba(0,0,0,.6) 100%)}
.today .tp{position:absolute;top:18px;left:20px;right:20px}
.today .tp p{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;opacity:.85}
.today .tp h2{font-family:var(--sfd);font-size:30px;line-height:34px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.today .bt{position:absolute;bottom:16px;left:20px;right:20px;font-size:15px;line-height:20px;font-weight:500}
.askcard{display:flex;align-items:center;gap:12px;margin:0 16px 30px;width:calc(100% - 32px);padding:12px 14px;border-radius:22px;background:var(--tint-soft);text-align:left;transition:transform .2s}
.askcard:active{transform:scale(.98)}
.askcard .av{width:46px;height:46px;border-radius:50%;background:center/cover;flex:none}
.askcard .tx{flex:1}
.askcard .chev{color:var(--tint)}
.shead{display:flex;justify-content:space-between;align-items:baseline;padding:0 16px 12px}
.shead h3{font-family:var(--sfd);font-size:22px;font-weight:700;letter-spacing:-.016em}
.shead button{font-size:17px;color:var(--tint)}
.shelf{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:0 16px 30px;scroll-snap-type:x mandatory;scroll-padding:0 16px}
.shelf::-webkit-scrollbar{display:none}
.shelf>*{scroll-snap-align:start;flex:none}
.cat{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:500;width:70px}
.cat .im{width:70px;height:70px;border-radius:20px;background:center/cover;transition:transform .2s}
.cat:active .im{transform:scale(.93)}
.pcard{width:156px;display:flex;flex-direction:column;gap:1px;text-align:left;cursor:pointer}
.pcard .im{height:192px;border-radius:18px;background:var(--fill) center/cover;margin-bottom:9px;transition:transform .25s var(--ease)}
.pcard:active .im{transform:scale(.96)}
.pcard .b{font-size:13px;color:var(--label2)}
.pcard .n{font-size:15px;font-weight:600;line-height:20px}
.pcard .p{font-size:13px;color:var(--label2)}
.wcard{width:290px}
.wcard .im{height:178px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px 12px;padding:0 16px}
.grid .pcard{width:auto;min-width:0}
.count{font-size:13px;color:var(--label2);padding:0 16px 12px}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:56px 32px}

/* detail pages */
.phero{position:relative;margin-top:calc(-1 * (var(--sbh) + 44px));overflow:hidden;background:#222}
.phero .bgi{position:absolute;inset:0;background:center/cover;will-change:transform}
.phero::after{content:"";position:absolute;inset:0 0 auto;height:150px;background:linear-gradient(rgba(0,0,0,.38),transparent);pointer-events:none}
.pinfo{padding:20px 16px 24px;display:flex;flex-direction:column;gap:4px}
.pinfo .brand{font-size:15px;font-weight:600;color:var(--tint)}
.pinfo .price{font-size:17px;color:var(--label2);margin-top:2px}
.pinfo .meta{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--label2);margin-top:4px}
.pinfo .blurb{font-size:17px;line-height:24px;margin-top:12px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:13px;font-weight:600;padding:5px 10px;border-radius:12px;background:var(--fill);color:var(--label2)}
.tag.on{background:var(--tint-fill);color:var(--on-tint)}
.tag.ok{background:rgba(52,199,89,.16);color:var(--green)}
.bottombar{position:absolute;left:0;right:0;bottom:0;z-index:12;display:flex;align-items:center;gap:14px;padding:12px 16px calc(var(--hb) + 8px);background:var(--bar);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);box-shadow:0 -.5px 0 var(--sep)}
.bottombar.col{flex-direction:column;align-items:stretch;gap:8px;padding-top:8px}
.bb-price{flex:1;min-width:0}
.bb-btn{width:164px}

/* requests */
.rcell{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;text-align:left;position:relative;transition:background .15s}
.rcell+.rcell::before{left:84px}
.rcell .th{width:56px;height:56px;border-radius:13px;background:center/cover;flex:none}
.rcell .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.rcell .t{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcell .s{font-size:15px;display:flex;align-items:center;gap:6px;font-weight:500}
.rcell .m{font-size:13px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcell .chev{color:var(--label3)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.tone-tint{color:var(--tint)}.tone-green{color:var(--green)}.tone-orange{color:var(--orange)}.tone-sec{color:var(--label2)}
.rhead{display:flex;align-items:center;gap:14px;padding:4px 16px 22px}
.rhead .th{width:66px;height:66px;border-radius:16px;background:center/cover;flex:none}
.track{position:relative;margin-top:16px}
.track .bar{height:6px;border-radius:3px;background:var(--fill);position:relative}
.track .fill{position:absolute;top:0;left:0;bottom:0;border-radius:3px;background:currentColor;transition:width 1s var(--ease)}
.track .pts{position:absolute;inset:-3px 0;display:flex;justify-content:space-between}
.track .pts i{width:12px;height:12px;border-radius:50%;background:var(--fill2);border:2px solid var(--cell)}
.track .pts i.on{background:currentColor}
.track .lbl{display:flex;justify-content:space-between;margin-top:9px;font-size:12px;color:var(--label2)}
.track .lbl span.on{color:var(--label);font-weight:600}
.quote .amt{font-family:var(--sfd);font-size:36px;font-weight:700;letter-spacing:-.02em;line-height:42px}
.quote .who{display:flex;align-items:center;gap:10px}
.quote .who .av{width:32px;height:32px;border-radius:50%;background:center/cover}
.btnrow{display:flex;gap:10px;margin-top:14px}
.btnrow .btn{flex:1;width:auto}

/* messages */
.icell{display:flex;gap:10px;padding:10px 16px 0 6px;width:100%;text-align:left;align-items:flex-start;transition:background .15s}
.icell .ud{width:10px;height:10px;border-radius:50%;background:var(--tint);margin-top:23px;flex:none;opacity:0}
.icell.unread .ud{opacity:1}
.icell .av{width:52px;height:52px;border-radius:50%;background:center/cover;flex:none}
.icell .tx{flex:1;min-width:0;padding-bottom:12px;border-bottom:.5px solid var(--sep)}
.icell:last-child .tx{border-bottom:0}
.icell .tp{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.icell .nm{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icell .tm{font-size:15px;color:var(--label2);display:flex;align-items:center;gap:4px;white-space:nowrap}
.icell .pv{font-size:15px;line-height:20px;color:var(--label2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:1px}
.cnav{display:flex;flex-direction:column;align-items:center;gap:3px;margin-top:6px}
.cnav .av{width:44px;height:44px;border-radius:50%;background:center/cover}
.cnav p{font-size:12px;font-weight:500;display:flex;align-items:center;gap:1px;padding:2px 8px;border-radius:10px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.msgs{display:flex;flex-direction:column;gap:3px;padding:4px 14px 10px}
.mtime{align-self:center;font-size:11px;color:var(--label2);margin:12px 0 6px;text-align:center}
.mtime b{font-weight:600}
.ctx{align-self:center;font-size:12px;color:var(--label2);padding:4px 10px;border-radius:10px;background:var(--fill);margin:2px 0 4px}
.bub{max-width:272px;padding:8px 14px;border-radius:20px;font-size:17px;line-height:22px;overflow-wrap:anywhere;animation:bub .35s var(--spring)}
.bub.them{background:var(--bubble);align-self:flex-start}
.bub.me{background:var(--tint-fill);color:#fff;align-self:flex-end}
.bub.them.tail{border-bottom-left-radius:6px}
.bub.me.tail{border-bottom-right-radius:6px}
.bub.gap,.rich.gap{margin-top:8px}
.delivered{align-self:flex-end;font-size:11px;color:var(--label2);margin:1px 4px 2px}
.typing{align-self:flex-start;background:var(--bubble);border-radius:20px;padding:12px 15px;display:flex;gap:4px;margin-top:8px;animation:bub .3s var(--spring)}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--label2);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
.rich{align-self:flex-start;width:264px;border-radius:20px;overflow:hidden;background:var(--bubble);text-align:left;transition:transform .2s}
.rich:active{transform:scale(.97)}
.rich .im{height:150px;background:center/cover}
.rich .bd{padding:10px 14px 13px}
.quick{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.quick::-webkit-scrollbar{display:none}
.quick .chip{height:32px;font-size:14px;background:var(--glass2);box-shadow:inset 0 0 0 .5px var(--sep)}
.composer{display:flex;align-items:center;gap:8px}
.composer .plus{width:36px;height:36px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--label2);flex:none}
.composer .fld{flex:1;min-width:0;height:38px;border-radius:19px;box-shadow:inset 0 0 0 1px var(--gray4);display:flex;align-items:center;padding:0 4px 0 14px;background:var(--bg)}
.composer input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:17px;outline:none;color:var(--label)}
.composer input::placeholder{color:var(--label3)}
.composer .send{width:30px;height:30px;border-radius:50%;background:var(--tint-fill);color:#fff;display:grid;place-items:center;transform:scale(0);transition:transform .22s var(--spring)}
.composer.has-text .send{transform:scale(1)}

/* profile */
.pass{position:relative;margin:0 16px 30px;height:206px;border-radius:22px;overflow:hidden;color:#fff;padding:18px 20px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(135deg,rgba(137,52,28,.9),rgba(64,20,9,.92)),url('img/yacht.jpg') center/cover;box-shadow:0 14px 30px rgba(64,20,9,.32);transition:transform .3s var(--ease)}
.pass:active{transform:scale(.98)}
.pass .pt{display:flex;justify-content:space-between;align-items:center}
.pass .wm{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.22em}
.pass .wm svg{width:22px;height:22px}
.pass .tier{font-size:13px;font-weight:700;letter-spacing:.18em;padding:4px 10px;border-radius:10px;background:rgba(255,255,255,.18)}
.pass .pb{display:flex;gap:28px}
.pass .pb small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.pass .pb b{font-size:17px;font-weight:600}
.me .av{width:60px;height:60px;border-radius:50%;background:var(--tint-soft);color:var(--tint);display:grid;place-items:center;font-size:22px;font-weight:600;flex:none}

/* onboarding */
.splash{position:absolute;inset:0;display:grid;place-items:center;background:#FEF7F5}
.lottie{width:330px;height:330px;margin-top:-30px}
.cover-btn{position:absolute;inset:0;z-index:2}
.skip{position:absolute;left:0;right:0;bottom:52px;text-align:center;font-size:13px;color:rgba(0,0,0,.45);z-index:1}
.hero-full{position:absolute;inset:0;background:center/cover}
.hero-full::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,.08) 40%,rgba(20,8,3,.9) 78%)}
.welcome{position:absolute;left:0;right:0;bottom:0;padding:0 22px calc(var(--hb) + 6px);color:#fff;display:flex;flex-direction:column;gap:10px;animation:rise .8s var(--ease) both}
.wmark{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:600;letter-spacing:-.01em}
.wmark svg{width:30px;height:30px}
.w-title{font-family:var(--sfd);font-size:42px;line-height:45px;font-weight:700;letter-spacing:-.03em;margin-top:6px}
.w-sub{font-size:17px;line-height:23px;opacity:.86}
.w-btns{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.btn.auth .lg{width:19px;height:19px;display:none}
.btn.auth .lg.ok{display:block}
.btn.apple{background:#fff;color:#000}
.btn.google{background:#131314;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.btn.glassbtn{background:rgba(255,255,255,.16);color:#fff;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.4)}
.w-fine{font-size:12px;line-height:16px;opacity:.65;text-align:center;margin-top:6px}
.otp{display:flex;gap:8px;margin-top:30px;align-items:center}
.otp input{width:46px;height:58px;border-radius:14px;border:0;background:var(--fill);text-align:center;font:inherit;font-size:26px;font-weight:600;color:var(--label);outline:none;caret-color:var(--tint);transition:box-shadow .2s,transform .2s}
.otp input:focus{box-shadow:0 0 0 2px var(--tint)}
.otp .dash{width:10px;height:2px;border-radius:1px;background:var(--label3);margin:0 2px}
.otpst{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--label2);height:24px;margin-top:16px}
.otpst.ok{color:var(--green)}
.suggest{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:19px;background:var(--fill);font-size:15px;margin-top:10px}
.suggest b{font-weight:600;letter-spacing:.06em}
.resend{font-size:15px;color:var(--label2);margin-top:18px}
.feat{display:flex;flex-direction:column;gap:26px;margin-top:34px}
.feat>div{display:flex;gap:16px;align-items:flex-start}
.feat .fi{width:44px;height:44px;display:grid;place-items:center;color:var(--tint);flex:none}
.feat p{font-size:15px;line-height:20px;color:var(--label2)}
.feat b{display:block;font-size:17px;color:var(--label);font-weight:600;margin-bottom:1px}
.hello{padding:26px 30px 10px;display:flex;flex-direction:column;align-items:center}
.hello .av{width:96px;height:96px;border-radius:50%;background:center/cover;margin-bottom:18px;box-shadow:0 8px 24px rgba(0,0,0,.15)}

/* tab bar */
#tabbar{position:absolute;left:14px;right:14px;bottom:calc(var(--hb) - 8px);height:64px;display:flex;gap:10px;z-index:20;transition:transform .45s var(--ease),opacity .3s}
#tabbar.hide{transform:translateY(130px);opacity:0;pointer-events:none}
.tb-main{flex:1;display:flex;align-items:center;padding:4px;border-radius:32px;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(190%);backdrop-filter:blur(22px) saturate(190%);box-shadow:inset 0 1px 0 var(--glass-edge),0 8px 28px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.08)}
.tb-item{flex:1;height:56px;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10px;font-weight:600;color:var(--label);position:relative;transition:background .25s,color .25s}
.tb-item.on{color:var(--tint);background:var(--hl)}
.tb-ask{width:64px;height:64px;border-radius:50%;background:var(--tint-fill);color:#fff;display:grid;place-items:center;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 8px 24px rgba(137,52,28,.38);transition:transform .2s var(--spring)}
.tb-ask:active{transform:scale(.9)}
.badge{position:absolute;top:5px;left:calc(50% + 5px);min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;animation:pop .4s var(--spring)}

/* system chrome */
.statusbar{position:absolute;top:0;left:0;right:0;height:var(--sbh);z-index:40;display:flex;justify-content:space-between;align-items:center;padding:6px 32px 0 50px;font-size:17px;font-weight:600;pointer-events:none;color:var(--label);transition:color .3s}
.statusbar.light{color:#fff}
.statusbar .icons{display:flex;gap:6px;align-items:center}
.island{position:absolute;top:11px;left:50%;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000;z-index:50;display:flex;align-items:center;gap:8px;padding:0 16px;color:#fff;font-size:14px;font-weight:600;overflow:hidden;transition:width .5s var(--spring),margin-left .5s var(--spring),height .5s var(--spring),border-radius .5s}
.island.open{width:300px;margin-left:-150px;height:46px;border-radius:23px}
.island .iic{color:#34C759;opacity:0;transition:opacity .2s}
.island .itx{opacity:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .2s}
.island.open .iic,.island.open .itx{opacity:1;transition-delay:.18s}
.homebar{position:absolute;bottom:8px;left:50%;width:136px;height:5px;margin-left:-68px;border-radius:3px;background:var(--label);z-index:60;pointer-events:none;opacity:.85;transition:background .3s}
.homebar.light{background:#fff}
#banner{position:absolute;top:58px;left:10px;right:10px;z-index:45;border-radius:26px;padding:12px 14px;display:flex;gap:11px;align-items:flex-start;background:var(--glass2);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:0 12px 34px rgba(0,0,0,.2);transform:translateY(-220px);opacity:0;visibility:hidden;transition:transform .55s var(--spring),opacity .3s,visibility 0s .55s;cursor:pointer;text-align:left;width:auto}
#banner.show{transform:translateY(0);opacity:1;visibility:visible;transition:transform .55s var(--spring),opacity .2s,visibility 0s}
#banner .appic{width:38px;height:38px;border-radius:9px;background:#FEF7F5;display:grid;place-items:center;flex:none}
#banner .appic svg{width:26px;height:26px}
#banner .bh{display:flex;justify-content:space-between;font-size:15px}
#banner .bh span{font-size:13px;color:var(--label2)}
#banner .bp{display:block;font-size:15px;line-height:20px}
#hud{position:absolute;left:50%;top:50%;width:156px;height:156px;margin:-78px 0 0 -78px;border-radius:26px;background:var(--glass2);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:55;opacity:0;transform:scale(.88);transition:opacity .2s,transform .35s var(--spring);pointer-events:none;font-size:15px;font-weight:600;box-shadow:0 12px 40px rgba(0,0,0,.18)}
#hud.show{opacity:1;transform:scale(1)}
.spinner{width:30px;height:30px;border-radius:50%;border:3px solid var(--fill2);border-top-color:var(--label);animation:spin .8s linear infinite;flex:none}
.spinner.sm{width:16px;height:16px;border-width:2px}
.spinner.light{border-color:rgba(255,255,255,.3);border-top-color:#fff;width:22px;height:22px}
.draw path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .45s .05s var(--ease) forwards}

/* sheets, menus */
#sheetLayer{position:absolute;inset:0;z-index:30;pointer-events:none}
#sheetLayer .scrim{position:absolute;inset:0;background:rgba(0,0,0,.18);opacity:0;transition:opacity .45s}
#sheetLayer.open{pointer-events:auto}
#sheetLayer.open .scrim{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;top:calc(var(--sbh) + 10px);border-radius:38px 38px 0 0;background:var(--sheet);transform:translateY(106%);transition:transform .5s var(--ease);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -8px 40px rgba(0,0,0,.18)}
.sheet.plain{background:var(--bg)}
.phone.dark .sheet.plain{background:var(--sheet)}
#sheetLayer.open .sheet{transform:translateY(0)}
.noanim,.noanim *{transition:none!important}
.grab{width:36px;height:5px;border-radius:3px;background:var(--gray4);margin:6px auto 0;flex:none}
.snav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:4px 12px 10px;flex:none;touch-action:none}
.snav .nav-t{opacity:1!important}
.grabzone{touch-action:none;cursor:grab;flex:none;padding-bottom:6px}
.sscroll{flex:1;overflow-y:auto;scrollbar-width:none;padding-bottom:24px}
.sscroll::-webkit-scrollbar{display:none}
.sbottom{padding:10px 16px calc(var(--hb) + 8px);flex:none}
.itemrow{display:flex;align-items:center;gap:12px;padding:4px 16px 22px}
.itemrow .th{width:58px;height:58px;border-radius:14px;background:center/cover;flex:none}
#menuLayer{position:absolute;inset:0;z-index:58;display:none}
#menuLayer.open{display:block}
.mscrim{position:absolute;inset:0}
#menuLayer.as .mscrim{background:rgba(0,0,0,.3);animation:fade .25s both}
.menu{position:absolute;width:250px;border-radius:18px;background:var(--glass2);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:0 14px 44px rgba(0,0,0,.22);overflow:hidden;animation:pop .32s var(--spring)}
.menu .mt{font-size:13px;color:var(--label2);padding:11px 16px 7px}
.menu button{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:0 16px 0 12px;font-size:17px;text-align:left}
.menu button+button,.menu .mt+button{box-shadow:inset 0 .5px 0 var(--sep)}
.menu button:active{background:var(--hl)}
.menu .ck{width:20px;display:grid;place-items:center}
.asheet{position:absolute;left:8px;right:8px;bottom:calc(var(--hb) - 6px);display:flex;flex-direction:column;gap:8px;animation:up .4s var(--ease) both}
.asheet .grp{border-radius:16px;overflow:hidden;background:var(--glass2);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%)}
.asheet .at{font-size:13px;line-height:18px;color:var(--label2);text-align:center;padding:14px 20px}
.asheet button{display:block;height:56px;width:100%;font-size:20px;color:var(--tint);text-align:center;box-shadow:inset 0 .5px 0 var(--sep)}
.asheet .danger{color:var(--red)}
.asheet .cancel{font-weight:600;box-shadow:none;background:var(--cell);border-radius:16px}

/* hotspots */
:is(body.hot .phone,.phone.flash) :is([data-go],[data-act],[data-back],[data-toast],[data-tab],[data-sheet],[data-close],[data-menu]){outline:2px solid var(--hot);outline-offset:-2px}
.phone.flash :is([data-go],[data-act],[data-back],[data-toast],[data-tab],[data-sheet],[data-close],[data-menu]){animation:hot .8s ease-out both}

@keyframes hot{from{outline-color:var(--hot)}to{outline-color:transparent}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,60%,100%{opacity:.35}30%{opacity:1}}
@keyframes bub{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(110%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){.phone *,.phone{transition:none!important;animation:none!important}}

/* ---------- phone width: the prototype runs full-screen ---------- */
@media (max-width:640px){
  .app{display:block;padding:0}
  .stage{height:100%;gap:0}
  #wrap{width:100%!important;height:100%!important}
  .phone{--sbh:44px;--hb:max(14px,env(safe-area-inset-bottom,0px));position:relative;width:100%;height:100%;transform:none!important;border-radius:0;box-shadow:none}
  .statusbar,.homebar{display:none}
  .island{display:none;top:6px}
  .island.open{display:flex}
  .caption{display:none}
  .navopen-btn{display:flex;position:fixed;z-index:70;top:calc(env(safe-area-inset-top,0px) + 9px);left:50%;transform:translateX(-50%);align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:14px;background:rgba(28,28,30,.86);color:#fff;font-size:12px;font-weight:600}

/* ---------- engine ---------- */
const phone=$('#phone'),stackEl=$('#stack'),tabbar=$('#tabbar'),sbar=$('#sbar'),homebar=$('#homebar'),sheetLayer=$('#sheetLayer'),sheetEl=$('#sheet'),menuLayer=$('#menuLayer');
let cur=null,hist=[],sheetId=null;
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const curEl=()=>stackEl.querySelector('.screen.cur');

function buildScreen(id,hasBack){
 const d=R[id]();const el=document.createElement('section');el.className='screen';el.dataset.id=id;
 ['grouped','large','hero','tallnav'].forEach(c=>{if(d[c])el.classList.add(c)});
 if(d.tab)el.classList.add('has-tab');if(d.bottom)el.classList.add(d.composer?'has-composer':'has-bottom');if(d.nav===false)el.classList.add('no-nav');
 if(d.raw){el.innerHTML=d.body}
 else{const nav=d.nav===false?'':`<header class="nav"><div class="nav-l">${d.left!==undefined?d.left:(hasBack?backBtn():'')}</div><div class="nav-t">${d.title||''}</div><div class="nav-r">${d.right||''}</div></header>`;
  const lt=d.large?`<div class="lt-wrap"><div>${d.eyebrow?`<p class="eyebrow">${d.eyebrow}</p>`:''}<h1 class="lt">${d.title}</h1></div>${d.ltRight||''}</div>`:'';
  el.innerHTML=`${nav}<div class="scroll">${lt}${d.body}</div>${d.bottom?`<div class="bottombar${d.bottomCol?' col':''}">${d.bottom}</div>`:''}`;
  const sc=el.querySelector('.scroll'),th=d.hero?290:(d.large?40:2),bg=el.querySelector('.phero .bgi');
  sc.addEventListener('scroll',()=>{const y=sc.scrollTop;el.classList.toggle('scrolled',y>th);if(bg)bg.style.transform=`translateY(${Math.max(0,y)*.4}px)`;if(el.classList.contains('cur'))chrome()},{passive:true});}
 el.querySelectorAll('img.lg').forEach(i=>{i.addEventListener('load',()=>i.classList.add('ok'));i.addEventListener('error',()=>i.remove())});
 el._d=d;return el}

function chrome(){const el=curEl(),d=(el&&el._d)||{};
 const light=!sheetId&&(d.lightAlways||(d.light&&el&&!el.classList.contains('scrolled')));
 sbar.classList.toggle('light',!!light);homebar.classList.toggle('light',!!d.lightAlways&&!sheetId);
 tabbar.classList.toggle('hide',!d.tab);if(d.tab)renderTabbar(d.tab)}
const TABS=[['home','Discover','compass'],['requests','Requests','checklist'],['inbox','Messages','bubble'],['profile','Profile','person']];
function renderTabbar(a){const badge=id=>{const n=id==='requests'?S.reqBadge:id==='inbox'?S.unread.size:0;return n?`<span class="badge">${n}</span>`:''};
 tabbar.innerHTML=`<div class="tb-main">${TABS.map(([id,l,i])=>`<button class="tb-item ${a===id?'on':''}" data-tab="${id}" aria-current="${a===id?'page':'false'}">${ic(i,25,a===id?'bold':'')}<span>${l}</span>${badge(id)}</button>`).join('')}</div><button class="tb-ask" data-sheet="ask" aria-label="New request">${ic('plus',28,'bold')}</button>`}

function show(id,mode='none'){
 clearTimeout(TM.resend);clearInterval(TM.resend);closeMenu();if(splashAnim){splashAnim.destroy();splashAnim=null}
 const old=curEl(),el=buildScreen(id,hist.length>0);cur=id;
 if(mode==='none'||!old||REDUCED){stackEl.innerHTML='';stackEl.appendChild(el);el.classList.add('cur')}
 else if(mode==='push'){el.classList.add('enter-r');stackEl.appendChild(el);el.offsetWidth;old.classList.remove('cur');el.classList.add('cur');requestAnimationFrame(()=>{el.classList.remove('enter-r');old.classList.add('exit-l')});setTimeout(()=>old.remove(),500)}
 else{el.classList.add('exit-l');stackEl.insertBefore(el,old);el.offsetWidth;old.classList.remove('cur');el.classList.add('cur');requestAnimationFrame(()=>{el.classList.remove('exit-l');old.classList.add('enter-r')});setTimeout(()=>old.remove(),500)}
 if(el._d.mount)el._d.mount(el,false);
 chrome();updateSide();setHash()}
function go(id){if(SHEET_BASE[id])return openSheet(id);hist.push(cur);show(id,'push')}
function back(){if(!hist.length)return;show(hist.pop(),'pop')}
function tab(id){if(id==='requests')S.reqBadge=0;hist=[];closeSheet(true);show(id,'none')}
function chain(id){const out=[];let p=PARENT[id];while(p){out.unshift(p);p=PARENT[p]}return out}
function jump(id){closeSheet(true);if(SHEET_BASE[id]){const b=SHEET_BASE[id];hist=chain(b);show(b,'none');setTimeout(()=>openSheet(id),80);return}hist=chain(id);show(id,'none')}
function refresh(){const old=curEl();if(!old)return;const ae=document.activeElement,fid=ae&&phone.contains(ae)&&ae.id,sel=fid&&'selectionStart' in ae?[ae.selectionStart,ae.selectionEnd]:null;
 const sc=old.querySelector('.scroll'),top=sc?sc.scrollTop:0,el=buildScreen(cur,hist.length>0);el.classList.add('cur');stackEl.replaceChild(el,old);
 const s2=el.querySelector('.scroll');if(s2){s2.scrollTop=top;s2.dispatchEvent(new Event('scroll'))}
 if(el._d.mount&&cur!=='code')el._d.mount(el,true);if(sheetId)renderSheet(true);chrome();updateSide();
 if(fid){const f=document.getElementById(fid);if(f){f.focus({preventScroll:true});if(sel&&f.setSelectionRange)try{f.setSelectionRange(sel[0],sel[1])}catch(e){}}}}

function openSheet(id){closeMenu();sheetId=id;renderSheet(false);sheetEl.offsetWidth;sheetLayer.classList.add('open');phone.classList.add('sheet-open');chrome();updateSide();setHash()}
function renderSheet(keep){const d=SH[sheetId]();const sc=keep&&sheetEl.querySelector('.sscroll'),top=sc?sc.scrollTop:0;
 sheetEl.className='sheet'+(d.plain?' plain':'');
 sheetEl.innerHTML=`<div class="grabzone"><div class="grab"></div>${d.noNav?'':`<div class="snav"><div class="nav-l">${d.left!==undefined?d.left:'<button class="nbtn" data-close>Cancel</button>'}</div><div class="nav-t">${d.title||''}</div><div class="nav-r">${d.right||''}</div></div>`}</div><div class="sscroll">${d.body}</div>${d.bottom?`<div class="sbottom">${d.bottom}</div>`:''}`;
 if(keep){const s2=sheetEl.querySelector('.sscroll');if(s2)s2.scrollTop=top}if(d.mount)d.mount(sheetEl,keep)}
function closeSheet(instant){if(!sheetId)return;sheetId=null;if(instant){sheetLayer.classList.add('noanim');phone.classList.add('noanim')}
 sheetLayer.classList.remove('open');phone.classList.remove('sheet-open');sheetEl.style.transform='';
 if(instant){sheetEl.innerHTML='';sheetEl.offsetWidth;sheetLayer.classList.remove('noanim');phone.classList.remove('noanim')}else setTimeout(()=>{if(!sheetId)sheetEl.innerHTML=''},520);
 chrome();updateSide();setHash()}

/* menus and action sheets */
function openMenu(anchor,key){const m=MENUS[key],pr=phone.getBoundingClientRect(),k=pr.width/393,ar=anchor.getBoundingClientRect();
 const W=250,H=44*m.o.length+(m.t?34:0);let left=Math.min(Math.max(12,(ar.right-pr.left)/k-W),393-W-12),top=(ar.bottom-pr.top)/k+6,org='top right';
 if(top+H>852-30){top=(ar.top-pr.top)/k-H-6;org='bottom right'}if(top<54)top=54;
 menuLayer.className='open';menuLayer.innerHTML=`<div class="mscrim" data-mclose></div><div class="menu" role="menu" style="left:${left}px;top:${top}px;transform-origin:${org}">${m.t?`<p class="mt">${m.t}</p>`:''}${m.o.map(o=>`<button role="menuitemradio" aria-checked="${o===S[m.k]}" data-mopt="${esc(o)}"><span class="ck">${o===S[m.k]?ic('check',17,'bold'):''}</span>${esc(o)}</button>`).join('')}</div>`;menuLayer._m=m}
function actionSheet(title,acts){menuLayer.className='open as';menuLayer.innerHTML=`<div class="mscrim" data-mclose></div><div class="asheet"><div class="grp"><p class="at">${title}</p>${acts.map((a,i)=>`<button class="${a.danger?'danger':''}" data-asi="${i}">${a.l}</button>`).join('')}</div><button class="cancel" data-mclose>Cancel</button></div>`;menuLayer._acts=acts}
function closeMenu(){menuLayer.className='';menuLayer.innerHTML=''}
menuLayer.addEventListener('click',e=>{e.stopPropagation();const o=e.target.closest('[data-mopt]'),a=e.target.closest('[data-asi]');
 if(o){const m=menuLayer._m;S[m.k]=o.dataset.mopt;closeMenu();refresh();return}
 if(a){const f=menuLayer._acts[+a.dataset.asi].f;closeMenu();f&&f();return}
 if(e.target.closest('[data-mclose]'))closeMenu()});

/* ---------- actions ---------- */
function sendMsg(text){text=(text||'').trim();if(!text)return;const k=S.thread;S.threads[k].push({me:1,t:text});refresh();scrollBottom();
 later('typing',600,()=>{S.typing=k;if(cur==='conversation'||cur==='inbox'){refresh();scrollBottom()}});
 later('reply',2300,()=>{S.typing=null;const list=REPLIES[k]||REPLIES.elena;S.ri[k]=(S.ri[k]||0);const msg=list[S.ri[k]++%list.length];S.threads[k].push({t:msg});
  if(cur==='conversation'&&S.thread===k&&!sheetId){refresh();scrollBottom()}else{S.unread.add(k);banner(k,msg);refresh()}})}
function scrollBottom(){const sc=curEl()&&curEl().querySelector('.scroll');if(sc)sc.scrollTo({top:sc.scrollHeight,behavior:REDUCED?'auto':'smooth'})}
function submitRequest(title,img){S.sent.unshift({id:'n'+Date.now(),title,img,ref:'PR-'+(2042+S.sent.length),kind:'Request',when:'Today'});S.reqBadge++;
 setTimeout(()=>hud('Sending…','Sent to Elena',()=>{refresh();later('ack',1700,()=>{const msg=`On it. I'll have options for "${title}" shortly.`;S.threads.elena.push({t:msg});S.unread.add('elena');banner('elena',msg);refresh()})}),280)}
const imgFor=c=>({Product:'handbag',Travel:'chalet',Dining:'chef',Event:'yacht',Transport:'car'})[c]||'villa';
function verify(){const st=document.getElementById('otpst');if(!st)return;document.querySelectorAll('.otp input').forEach(x=>x.blur());
 st.className='otpst';st.innerHTML=`<span class="spinner sm"></span>Verifying…`;
 later('v1',900,()=>{st.className='otpst ok';st.innerHTML=`${ic('check',17,'bold')}Verified`;later('v2',550,()=>{S.otp=['','','','','',''];if(S.returning){tab('home');island('Welcome back, '+firstName())}else go('setup')})})}
function startResend(el){let n=30;const out=el.querySelector('#resend');const tick=()=>{if(!out)return;out.innerHTML=n>0?`Resend code in 0:${String(n).padStart(2,'0')}`:`<button class="link" data-act="resend">Resend code</button>`;n--};
 tick();clearInterval(TM.resend);TM.resend=setInterval(()=>{if(n<-1)return clearInterval(TM.resend);tick()},1000);
 const first=el.querySelector('#otp0');if(first&&!S.otp[0])setTimeout(()=>first.focus({preventScroll:true}),460)}
const ACT={
 skipSplash:()=>{tab('welcome');return 'stop'},
 sso:a=>{hud('Signing in…','Signed in with '+a,()=>{if(S.returning){tab('home');island('Welcome back, '+firstName())}else{hist=['welcome'];show('setup','push')}});return 'stop'},
 sendCode:()=>{if(!S.email.includes('@'))S.email='nadia@email.com';go('code');return 'stop'},
 autofill:()=>{'482915'.split('').forEach((c,i)=>later('af'+i,70*i,()=>{S.otp[i]=c;const x=document.getElementById('otp'+i);if(x)x.value=c;if(i===5)verify()}));return 'stop'},
 resend:()=>{island('New code sent');const el=curEl();if(el)startResend(el);return 'stop'},
 interest:a=>{S.interests.has(a)?S.interests.delete(a):S.interests.add(a)},
 finishSetup:()=>{S.name=S.fname.trim()||'Nadia';tab('home');later('hello',450,()=>openSheet('hello'));return 'stop'},
 brand:a=>{S.brand=a},
 save:()=>{const id=S.item;if(S.saved.has(id)){S.saved.delete(id);island('Removed from Wishlist','heart')}else{S.saved.add(id);island('Saved to Wishlist','heart')}},
 qty:a=>{const it=ITEMS[S.item];const v=(S.qty[S.item]||it.q)+(+a);S.qty[S.item]=Math.min(14,Math.max(1,v))},
 rsvp:()=>{S.rsvp=!S.rsvp;if(!S.rsvp)S.cal=false;island(S.rsvp?"RSVP confirmed. See you on 5 Dec":'RSVP cancelled',S.rsvp?'check':'xmark')},
 cal:()=>{if(S.cal)return 'stop';S.cal=true;island('Added to Calendar','calendar')},
 sendReq:()=>{const it=ITEMS[S.item]||ITEMS.nautilus;closeSheet();S.note='';submitRequest(it.name,it.img);return 'stop'},
 askSuggest:a=>{S.ask.text=a;renderSheet(true);const t=document.getElementById('askText');if(t){t.focus({preventScroll:true});t.setSelectionRange(a.length,a.length)}return 'stop'},
 askSend:()=>{const t=S.ask.text.trim();if(!t)return 'stop';closeSheet();submitRequest(t.length>40?t.slice(0,38)+'…':t,imgFor(S.askcat));S.ask.text='';return 'stop'},
 askFromSearch:()=>{S.ask.text=S.q;openSheet('ask');return 'stop'},
 setq:a=>{S.q=a},
 clearRecent:()=>{S.recent=false},
 reqSeg:a=>{S.reqSeg=a},
 setReq:a=>{S.req=a},
 payMode:a=>{S.pay=a},
 pay:(a,el)=>{el.classList.add('loading');el.innerHTML='<span class="spinner light"></span>';
  later('pay1',1200,()=>{el.classList.add('done');el.innerHTML=`<span class="draw">${ic('check',24,'bold')}</span>Done`;
   later('pay2',750,()=>{S.paid=true;S.justPaid=true;closeSheet();refresh();island('Payment complete')})});return 'stop'},
 thread:a=>{S.thread=a},
 quick:a=>{sendMsg(a);return 'stop'},
 send:()=>{const i=document.getElementById('msg');sendMsg(i&&i.value);return 'stop'},
 notif:()=>{S.notif=!S.notif},
 emailUp:()=>{S.emailUp=!S.emailUp},
 wl:a=>{S.wl=a},
 favBrand:a=>{S.favBrands.has(a)?S.favBrands.delete(a):S.favBrands.add(a)},
 signOut:()=>{actionSheet('Sign out of Persimon? Your requests and messages stay safe.',[{l:'Sign Out',danger:1,f:()=>{reset();hist=[];show('welcome','none')}}]);return 'stop'}
};

/* ---------- input ---------- */
phone.addEventListener('click',e=>{
 if(dragMoved){dragMoved=false;return}
 const t=e.target.closest('[data-go],[data-back],[data-act],[data-toast],[data-tab],[data-sheet],[data-close],[data-menu]');
 if(!t){if(!e.target.closest('input,textarea,label,.gcard,.sheet'))flash();return}
 const d=t.dataset;
 if(d.item)S.item=d.item;
 if(d.menu){openMenu(t,d.menu);return}
 if(d.anim==='seg'){const sg=t.closest('.seg'),bs=[...sg.querySelectorAll('button')];sg.style.setProperty('--i',bs.indexOf(t));bs.forEach(b=>b.classList.toggle('on',b===t));later('anim',280,()=>{ACT[d.act](d.arg,t);refresh()});return}
 if(d.anim==='switch'){const sw=t.querySelector('.switch-ios');if(sw)sw.classList.toggle('on');later('anim',260,()=>{ACT[d.act](d.arg,t);refresh()});return}
 if(d.act&&ACT[d.act]){if(ACT[d.act](d.arg,t)==='stop')return}
 if(d.toast)island(d.toast,'sparkles');
 if('close' in d){closeSheet();return}
 if(d.tab)tab(d.tab);
 else if(d.sheet)openSheet(d.sheet);
 else if(d.go)go(d.go);
 else if('back' in d)back();
 else if(d.act)refresh()});
phone.addEventListener('input',e=>{const el=e.target,id=el.id;
 if(id==='email')S.email=el.value;
 else if(id==='fname')S.fname=el.value;
 else if(id==='q'){S.q=el.value;const r=document.getElementById('results');if(r)r.innerHTML=results()}
 else if(id==='askText'){S.ask.text=el.value;const b=document.getElementById('askSend');if(b)b.disabled=!el.value.trim()}
 else if(id==='note')S.note=el.value;
 else if(id==='msg')el.closest('.composer').classList.toggle('has-text',!!el.value.trim());
 else if(/^otp\d$/.test(id)){const i=+id.slice(3),v=el.value.replace(/\D/g,'');
  if(v.length>1){v.split('').slice(0,6-i).forEach((c,k)=>{S.otp[i+k]=c;const x=document.getElementById('otp'+(i+k));if(x)x.value=c})}else{S.otp[i]=v;el.value=v}
  const nx=S.otp.findIndex(c=>!c);if(nx===-1)verify();else if(v){const x=document.getElementById('otp'+nx);if(x)x.focus()}}});
phone.addEventListener('keydown',e=>{const id=e.target.id;
 if(id==='msg'&&e.key==='Enter'){e.preventDefault();sendMsg(e.target.value);return}
 if(id==='email'&&e.key==='Enter'){e.preventDefault();ACT.sendCode();return}
 if(/^otp\d$/.test(id)&&e.key==='Backspace'&&!e.target.value){const p=document.getElementById('otp'+(+id.slice(3)-1));if(p){p.focus();p.value='';S.otp[+id.slice(3)-1]=''}}
 if((e.key==='Enter'||e.key===' ')&&e.target.getAttribute('role')==='button'){e.preventDefault();e.target.click()}
 if(e.key==='Escape'){if(menuLayer.classList.contains('open'))closeMenu();else if(sheetId)closeSheet()}});

/* swipe back from the left edge, drag sheets down to close */
let pd=null,drag=null,dragMoved=false;
const kScale=()=>phone.getBoundingClientRect().width/393;
stackEl.addEventListener('pointerdown',e=>{if(!hist.length||sheetId||REDUCED)return;const pr=phone.getBoundingClientRect(),k=pr.width/393;if((e.clientX-pr.left)/k>22)return;pd={x0:e.clientX,y0:e.clientY,k}});
stackEl.addEventListener('pointermove',e=>{
 if(pd&&!drag){const dx=(e.clientX-pd.x0)/pd.k,dy=Math.abs(e.clientY-pd.y0)/pd.k;if(dy>12&&dy>dx){pd=null;return}
  if(dx>8){const top=curEl(),pid=hist[hist.length-1],under=buildScreen(pid,hist.length>1);under.classList.add('exit-l');under.style.transition=top.style.transition='none';
   stackEl.insertBefore(under,top);drag={x0:pd.x0,k:pd.k,top,under,pid,dx:0};pd=null;dragMoved=true;try{stackEl.setPointerCapture(e.pointerId)}catch(_){}}}
 if(!drag)return;const dx=Math.max(0,(e.clientX-drag.x0)/drag.k);drag.dx=dx;const p=Math.min(1,dx/393);
 drag.top.style.transform=`translateX(${dx}px)`;drag.under.style.transform=`translateX(${-28*(1-p)}%)`;drag.under.style.setProperty('--dim',1-p)});
const endDrag=()=>{pd=null;if(!drag)return;const {top,under,dx,pid}=drag,done=dx>393*.3;drag=null;
 top.style.transition=under.style.transition='transform .32s var(--ease)';
 if(done){top.style.transform='translateX(100%)';under.style.transform='translateX(0)';under.style.setProperty('--dim',0);
  setTimeout(()=>{top.remove();under.classList.remove('exit-l');under.style.cssText='';under.classList.add('cur');hist.pop();cur=pid;if(under._d.mount)under._d.mount(under,true);chrome();updateSide();setHash()},330)}
 else{top.style.transform='';under.style.transform='translateX(-28%)';setTimeout(()=>{under.remove();top.style.cssText=''},330)}
 setTimeout(()=>{dragMoved=false},60)};
stackEl.addEventListener('pointerup',endDrag);stackEl.addEventListener('pointercancel',endDrag);
let sd=null;
sheetEl.addEventListener('pointerdown',e=>{if(!e.target.closest('.grabzone')||e.target.closest('button'))return;sd={y0:e.clientY,k:kScale(),dy:0};sheetEl.style.transition='none';sheetEl.setPointerCapture(e.pointerId)});
sheetEl.addEventListener('pointermove',e=>{if(!sd)return;sd.dy=Math.max(0,(e.clientY-sd.y0)/sd.k);sheetEl.style.transform=`translateY(${sd.dy}px)`});
const endSheet=()=>{if(!sd)return;const dy=sd.dy;sd=null;sheetEl.style.transition='';if(dy>110){closeSheet()}else sheetEl.style.transform=''};
sheetEl.addEventListener('pointerup',endSheet);sheetEl.addEventListener('pointercancel',endSheet);

/* ---------- splash ---------- */
let splashAnim=null,splashJSON=null;
function startSplash(el){const box=el.querySelector('#lottie'),next=()=>{if(cur==='splash')tab('welcome')};
 try{if(!window.lottie||!box)throw new Error('no lottie');splashJSON=splashJSON||JSON.parse(document.getElementById('splashData').textContent);
  splashAnim=lottie.loadAnimation({container:box,renderer:'svg',loop:false,autoplay:true,animationData:splashJSON});splashAnim.addEventListener('complete',()=>later('splash',450,next))}
 catch(err){later('splash',1200,next)}}

/* ---------- navigator ---------- */
const OTP6=['4','8','2','9','1','5'];
const STATES={
 code:[['New member',s=>{s.returning=false},s=>!s.returning],['Returning member',s=>{s.returning=true},s=>s.returning]],
 watches:[['All brands',s=>{s.brand='All'},s=>s.brand==='All'],['Filtered: Rolex',s=>{s.brand='Rolex'},s=>s.brand==='Rolex']],
 product:[['Nautilus',s=>{s.item='nautilus'},s=>s.item==='nautilus'],['Kelly 25',s=>{s.item='kelly'},s=>s.item==='kelly']],
 service:[['Private chef',s=>{s.item='chef'},s=>s.item==='chef'],['Chalet',s=>{s.item='chalet'},s=>s.item==='chalet'],['Chauffeur',s=>{s.item='car'},s=>s.item==='car']],
 event:[['Before RSVP',s=>{s.rsvp=false;s.cal=false},s=>!s.rsvp],['Going',s=>{s.rsvp=true},s=>s.rsvp]],
 ask:[['Empty',s=>{s.ask.text=''},s=>!s.ask.text],['Filled in',s=>{s.ask.text='A table for 4 at Noma this Friday, around 8pm';s.askcat='Dining';s.when='This week'},s=>!!s.ask.text]],
 requests:[['Active',s=>{s.reqSeg='Active';s.paid=false},s=>s.reqSeg==='Active'&&!s.paid],['After payment',s=>{s.reqSeg='Active';s.paid=true},s=>s.reqSeg==='Active'&&s.paid],['Completed',s=>{s.reqSeg='Completed'},s=>s.reqSeg==='Completed']],
 request:[['Quote ready',s=>{s.req='patek';s.paid=false},s=>s.req==='patek'&&!s.paid],['Paid',s=>{s.req='patek';s.paid=true;s.pay='full'},s=>s.req==='patek'&&s.paid],['Needs details',s=>{s.req='gstaad'},s=>s.req==='gstaad']],
 checkout:[['Pay in full',s=>{s.pay='full'},s=>s.pay==='full'],['30% deposit',s=>{s.pay='deposit'},s=>s.pay==='deposit']],
 inbox:[['Unread',s=>{s.unread=new Set(['elena','patek'])},s=>s.unread.size>0],['All read',s=>{s.unread=new Set()},s=>s.unread.size===0]],
 conversation:[['Nautilus quote',s=>{s.thread='patek'},s=>s.thread==='patek'],['Gstaad question',s=>{s.thread='gstaad'},s=>s.thread==='gstaad'],['Elena',s=>{s.thread='elena'},s=>s.thread==='elena']],
 wishlist:[['All',s=>{s.wl='All'},s=>s.wl==='All'],['Products',s=>{s.wl='Products'},s=>s.wl==='Products'],['Services',s=>{s.wl='Services'},s=>s.wl==='Services']]
};
const nStates=Object.values(STATES).reduce((a,v)=>a+v.length,0);
$('#brand').innerHTML=logo()+'Persimon';
$('#navMeta').textContent=`iOS prototype · v2.0 · ${ORDER.length} screens · ${nStates} states`;
$('#list').innerHTML=FLOWS.map(([s,it])=>`<div class="flow"><h4>${s}</h4>${it.map(([id,code,name,sh])=>`<button class="scr" data-id="${id}"><span class="code">${code}</span>${name}${sh?'<span class="kind">Sheet</span>':''}</button>${STATES[id]?`<div class="states">${STATES[id].map(([l],i)=>`<button class="st" data-id="${id}" data-i="${i}">${l}</button>`).join('')}</div>`:''}`).join('')}</div>`).join('');
$('#list').addEventListener('click',e=>{const st=e.target.closest('.st'),b=e.target.closest('.scr');
 if(st){const id=st.dataset.id;STATES[id][+st.dataset.i][1](S);const here=(sheetId||cur)===id;if(here){if(sheetId)renderSheet(true);refresh()}else jump(id)}
 else if(b)jump(b.dataset.id);else return;document.body.classList.remove('navopen')});
function updateSide(){const id=sheetId||cur,m=META[id];if(!m)return;$('#capCode').textContent=m.code;$('#capName').textContent=m.name;$('#capSec').textContent='· '+m.sec+(m.sheet?' · sheet':'');
 document.querySelectorAll('.scr').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
 document.querySelectorAll('.st').forEach(b=>{let on=false;if(b.dataset.id===id){try{on=!!STATES[id][+b.dataset.i][2](S)}catch(e){}}b.classList.toggle('on',on)})}
function setHash(){const id=sheetId||cur;try{if(id&&location.hash.slice(1)!==id)history.replaceState(null,'','#'+id)}catch(e){try{location.hash=id}catch(_){}}}
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(id&&id!==(sheetId||cur)&&(R[id]||SH[id]))jump(id)});
const hot=$('#hotToggle'),dark=$('#darkToggle');
hot.addEventListener('change',()=>{document.body.classList.toggle('hot',hot.checked);try{localStorage.setItem('psm-hot',hot.checked?'1':'0')}catch(e){}});
dark.addEventListener('change',()=>{phone.classList.toggle('dark',dark.checked);try{localStorage.setItem('psm-dark',dark.checked?'1':'0')}catch(e){}});
try{if(localStorage.getItem('psm-hot')==='1'){hot.checked=true;document.body.classList.add('hot')}if(localStorage.getItem('psm-dark')==='1'){dark.checked=true;phone.classList.add('dark')}}catch(e){}
$('#restart').innerHTML=ic('rotate',16)+'Restart';
$('#restart').addEventListener('click',()=>{reset();closeSheet(true);closeMenu();$('#banner').classList.remove('show');$('#hud').classList.remove('show');hist=[];show('splash','none');document.body.classList.remove('navopen')});
$('#navOpen').innerHTML=ic('layers',14)+'Screens';
$('#navOpen').addEventListener('click',()=>document.body.classList.add('navopen'));
$('#navClose').innerHTML=ic('xmark',18);
$('#navClose').addEventListener('click',()=>document.body.classList.remove('navopen'));
const step=d=>{const i=ORDER.findIndex(o=>o.id===(sheetId||cur));jump(ORDER[(i+d+ORDER.length)%ORDER.length].id)};
$('#prev').innerHTML=ic('chevL',18);$('#next').innerHTML=ic('chevR',18);
$('#prev').addEventListener('click',()=>step(-1));$('#next').addEventListener('click',()=>step(1));
document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea'))return;if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});

/* ---------- fit the phone to the stage ---------- */
const stage=$('#stage'),wrap=$('#wrap');
function fit(){if(matchMedia('(max-width:640px)').matches){phone.style.transform='';wrap.style.width='';wrap.style.height='';return}
 const r=stage.getBoundingClientRect(),s=Math.min(1,(r.height-96)/852,(r.width-56)/393);phone.style.transform=`scale(${s})`;wrap.style.width=393*s+'px';wrap.style.height=852*s+'px'}
addEventListener('resize',fit);fit();

const start=location.hash.slice(1);
if(start&&(R[start]||SH[start]))jump(start);else show('splash','none');
</script>
