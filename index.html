<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Percimon Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: flow navigator on the left, one scaled phone on a quiet canvas; on phones the prototype runs full-screen. */
:root{
  --bg:#E8E9EC; --panel:#F6F6F8; --fg:#18191C; --muted:#6A6C73; --line:#D4D6DB; --accent:#89341C;
  --hot:rgba(228,87,46,.85);
  --ink:#1A1A1A; --sub:#6B6B6B; --mute:#9E9E9E; --pline:#D6D6D6; --pfill:#F2F2F2; --pfill2:#E0E0E0; --paper:#FFFFFF;
  --sans:"Inter",-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#131416;--panel:#1B1C1F;--fg:#ECEDF0;--muted:#9B9DA4;--line:#2D2F34;--accent:#E4572E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#131416;--panel:#1B1C1F;--fg:#ECEDF0;--muted:#9B9DA4;--line:#2D2F34;--accent:#E4572E;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- shell ---------- */
.app{height:100%;box-sizing:border-box;display:grid;grid-template-columns:minmax(232px,280px) minmax(0,1fr);gap:24px;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav{background:var(--panel);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.nav-head{padding:20px 20px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;letter-spacing:-.01em}
.brand .fruit{width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:inset -3px -3px 0 rgba(0,0,0,.15)}
.nav-head p{margin:0;font-size:13px;color:var(--muted)}
.nav-head .close{display:none}
.ctrls{display:flex;gap:8px;padding:12px 20px;border-bottom:1px solid var(--line);align-items:center;justify-content:space-between}
.switch{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;user-select:none}
.switch input{appearance:none;width:30px;height:18px;border-radius:9px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .15s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--panel);transition:transform .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(12px)}
.restart{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);padding:6px 8px;border-radius:8px}
.restart:hover{color:var(--fg);background:var(--bg)}
.list{overflow-y:auto;padding:8px 12px 12px;flex:1;min-height:0}
.flow{margin-top:12px}
.flow h4{margin:0 8px 4px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.scr{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border-radius:8px;font-size:14px}
.scr:hover{background:var(--bg)}
.scr .code{font-family:var(--mono);font-size:11px;color:var(--muted);width:24px;font-variant-numeric:tabular-nums}
.scr.on{background:var(--bg);font-weight:600}
.scr.on .code{color:var(--accent)}
.states{display:flex;flex-wrap:wrap;gap:4px;padding:2px 8px 8px 42px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;line-height:1;padding:5px 8px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--line)}
.st:hover{color:var(--fg)}
.st.on{color:var(--fg);box-shadow:inset 0 0 0 1px var(--accent)}
.st.on::before{background:var(--accent)}
.nav-foot{margin:0;padding:12px 20px 16px;border-top:1px solid var(--line);font-size:12px;line-height:1.5;color:var(--muted)}

.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;min-width:0;min-height:0}
.wrap{position:relative;flex:none;width:375px;height:812px}
.caption{display:flex;align-items:center;gap:14px;font-size:14px}
.caption .code{font-family:var(--mono);font-size:12px;color:var(--accent)}
.caption .sec{color:var(--muted)}
.step{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.step:hover{color:var(--fg);border-color:var(--muted)}
.navopen-btn{display:none}

/* ---------- phone: hi-fi, built from the Percimon design system (accent-colors, Inter Regular/Medium) ---------- */
.phone{--primary:#89341C;--on-primary:#FFFFFF;--pc:#E7D6D2;--on-pc:#37150B;--surface:#FEF7F5;--lowest:#FFFFFF;--low:#F2F2F2;--cont:#E6E6E6;--ink:#1C1C1C;--sub:#494949;--outline:#A7A7A7;--ovar:#E7E7E7;--succ:#00BA56;--succ-c:#E6FDF0;--on-succ-c:#004620;--inv-s:#362E2B;--inv-p:#D0AEA4;
 position:absolute;top:0;left:0;width:375px;height:812px;transform-origin:top left;background:var(--surface);color:var(--ink);border-radius:44px;box-shadow:0 0 0 9px #0E0E10,0 28px 70px rgba(54,20,10,.28);overflow:hidden;display:flex;flex-direction:column;font-family:var(--sans);font-size:16px;line-height:1.4;color-scheme:light}
.phone p,.phone h2,.phone h3{margin:0}
.sb{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:16px;font-weight:500}
.sb i{width:26px;height:12px;border-radius:3px;background:var(--ink)}
.topbar{height:56px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.topbar h1{margin:0;font-size:25px;font-weight:500;letter-spacing:-.01em}
.topbar .t{font-size:16px;font-weight:500}
.topbar .sp{width:40px}
.circ{width:40px;height:40px;border-radius:50%;background:var(--lowest);box-shadow:inset 0 0 0 1px var(--ovar);display:grid;place-items:center;flex:none}
.content{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:20px;padding:12px max(20px,env(safe-area-inset-right,0px)) 24px max(20px,env(safe-area-inset-left,0px));scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
.content>*{flex-shrink:0}
.content.tight{gap:14px}
.content.center{justify-content:center;align-items:center;text-align:center;gap:16px}
.content.bottom{justify-content:flex-end;gap:14px;padding-bottom:34px}
.footer{flex:none;display:flex;flex-direction:column;gap:8px;padding:12px 20px 34px;border-top:1px solid var(--ovar);background:var(--lowest)}
.tabbar{height:84px;flex:none;display:flex;justify-content:space-between;align-items:flex-start;padding:8px 12px 0;border-top:1px solid var(--ovar);background:var(--lowest)}
.tab{width:62px;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:4px;font-size:10px;color:var(--sub)}
.tab svg{color:var(--outline)}
.tab.on{color:var(--primary);font-weight:500}
.tab.on svg{color:var(--primary)}
.tab .askb{width:52px;height:52px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;margin-top:-6px;box-shadow:0 6px 16px rgba(137,52,28,.32)}

.btn{height:48px;width:100%;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:500;flex:none;padding:0 16px}
.hrow>.btn{flex:1}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.secondary{box-shadow:inset 0 0 0 1px var(--primary);color:var(--primary);background:var(--lowest)}
.btn.ghost{color:var(--primary)}
.btn.small{width:auto;flex:none;height:40px}
.sso{height:48px;width:100%;border-radius:8px;background:var(--lowest);box-shadow:inset 0 0 0 1px var(--outline);display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;font-weight:500;flex:none;color:var(--ink)}
.sso .logo{width:22px;height:22px;border-radius:6px;background:#000;color:#fff;display:grid;place-items:center;font-size:13px;font-style:normal;font-weight:500}
.ssorow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.divider{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--sub)}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--ovar)}
.linkline{font-size:13px;font-weight:500;color:var(--primary);text-align:center;padding:6px 0}
.iconbtn{width:48px;height:48px;flex:none;border-radius:8px;box-shadow:inset 0 0 0 1px var(--primary);color:var(--primary);display:grid;place-items:center}
.field{position:relative;display:block;min-width:0}
.field input,.field textarea{width:100%;height:48px;border:1px solid var(--outline);border-radius:8px;padding:18px 12px 4px;font:inherit;font-size:16px;color:var(--ink);background:var(--lowest);outline:none;box-sizing:border-box}
.field textarea{height:120px;padding:24px 12px 8px;resize:none;display:block}
.field>span{position:absolute;left:13px;top:13px;font-size:16px;line-height:1.35;color:var(--sub);pointer-events:none;transition:top .15s,font-size .15s}
.field :is(input,textarea):is(:focus,:not(:placeholder-shown)){border-color:var(--primary)}
.field :is(input,textarea):is(:focus,:not(:placeholder-shown))+span{top:5px;font-size:10px}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;height:56px;width:100%;border-bottom:1px solid var(--ovar);text-align:left}
.row .l{flex:1;font-size:16px}
.row .v{font-size:13px;color:var(--sub)}
.row svg{color:var(--outline)}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.pills::-webkit-scrollbar{display:none}
.pills.wrap{flex-wrap:wrap;margin:0;padding:0;overflow:visible}
.pill{height:32px;padding:0 10px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--primary);color:var(--primary);background:var(--lowest);font-size:15px;flex:none;display:inline-flex;align-items:center;white-space:nowrap}
.pill.on{background:var(--pc);color:var(--on-pc)}
.seg{display:flex;gap:4px;padding:4px;border-radius:8px;background:var(--cont)}
.seg button{flex:1;height:34px;border-radius:4px;font-size:13px;font-weight:500;color:var(--sub);text-align:center}
.seg button.on{background:var(--lowest);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.spill{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;background:var(--low);color:var(--sub);font-size:10px;font-weight:500;flex:none;white-space:nowrap}
.spill.act{background:var(--pc);color:var(--on-pc)}
.spill.dark{background:var(--primary);color:var(--on-primary)}
.spill.ok{background:var(--succ-c);color:var(--on-succ-c)}
.pic{background:var(--cont) center/cover no-repeat;border-radius:12px;flex:none;width:100%}
.shead{display:flex;justify-content:space-between;align-items:center}
.shead h3{font-size:20px;font-weight:500}
.shead .a{font-size:13px;font-weight:500;color:var(--primary)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 15px}
.card{display:flex;flex-direction:column;gap:2px;text-align:left;cursor:pointer;min-width:0}
.card .pic{height:190px;margin-bottom:8px;position:relative}
.card .heart{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;background:var(--lowest);color:var(--primary);display:grid;place-items:center}
.card .b{font-size:13px;color:var(--sub)}
.card .n{font-size:16px;font-weight:500}
.card .p{font-size:13px;font-weight:500;color:var(--primary)}
.hscroll{display:flex;gap:15px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .card{width:160px;flex:none}
.box{background:var(--lowest);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:inset 0 0 0 1px var(--ovar)}
.box.tonal{background:var(--pc);color:var(--on-pc);box-shadow:none}
.box.soft{background:var(--low);box-shadow:none}
.box.rq{flex-direction:row;align-items:flex-start;gap:12px;padding:12px;cursor:pointer}
.hrow{display:flex;align-items:center;gap:12px}
.box.hrow{flex-direction:row}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stack{display:flex;flex-direction:column;gap:6px}
.stack.g2{gap:2px}
.label{font-size:13px;font-weight:500;color:var(--sub);margin-bottom:-6px}
.k{font-size:13px;font-weight:500;letter-spacing:.24em;color:var(--sub)}
.h1{font-size:39px;font-weight:500;line-height:1.1;letter-spacing:-.02em;text-wrap:balance}
.h2{font-size:25px;font-weight:500;line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--sub)}.mute{color:var(--outline)}.pri{color:var(--primary)}
.onimg{color:#fff}
.s10{font-size:10px}.s12{font-size:12px}.s13{font-size:13px}.s14{font-size:14px}.s15{font-size:15px}.s16{font-size:16px}.s17{font-size:17px}.s20{font-size:20px}.s22{font-size:22px}.s25{font-size:25px}.s28{font-size:28px}.s31{font-size:31px}
.b500,.b600,.b700{font-weight:500}
.num{font-variant-numeric:tabular-nums}
.fine{font-size:10px;color:var(--sub);text-align:center}
.search{display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;border-radius:8px;background:var(--low);box-shadow:inset 0 0 0 1px var(--outline);color:var(--sub);width:100%;text-align:left;box-sizing:border-box}
.search span{flex:1;font-size:16px}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);outline:none}
.search input::placeholder{color:var(--sub)}
.hero{position:relative;height:196px;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;padding:16px;color:#fff;background:center/cover no-repeat;cursor:pointer}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(23,8,3,.82) 100%)}
.hero>*{position:relative}
.hero .k{color:#fff;font-size:10px;letter-spacing:.16em}
.cats{display:flex;justify-content:space-between}
.cat{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:500}
.cat .pic{width:64px;height:64px;border-radius:32px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:-4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--pc)}
.dots i.on{background:var(--primary)}
.badge{width:88px;height:88px;border-radius:50%;background:var(--pc);color:var(--primary);display:grid;place-items:center}
.badge.ok{background:var(--succ-c);color:var(--succ)}
.prog{display:flex;gap:6px}
.prog i{flex:1;height:4px;border-radius:2px;background:var(--pc)}
.prog i.on{background:var(--primary)}
.otp{display:flex;gap:8px;justify-content:center}
.otp input{width:48px;min-width:0;height:48px;border:1px solid var(--outline);border-radius:8px;text-align:center;font:inherit;font-size:16px;color:var(--ink);outline:none;background:var(--low)}
.otp input:focus,.otp input:not(:placeholder-shown){border-color:var(--primary);background:var(--lowest)}
.tl{display:flex;flex-direction:column}
.tl>div{height:32px;display:flex;align-items:center;gap:12px}
.tl .d{width:12px;height:12px;border-radius:50%;background:var(--pc);box-sizing:border-box;flex:none}
.tl .d.done{background:var(--primary)}
.tl .d.now{background:var(--lowest);border:3px solid var(--primary)}
.tl .x{flex:1}
.tl .todo .x{color:var(--outline)}
.tl .now .x{font-weight:500}
.checks{display:flex;flex-direction:column;gap:10px}
.checks svg{color:var(--primary)}
.meta{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
.attach{display:flex;gap:10px}
.addph{width:64px;height:64px;border-radius:12px;border:1px dashed var(--primary);display:grid;place-items:center;color:var(--primary);flex:none}
.thread{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--ovar);cursor:pointer;text-align:left;width:100%}
.thread .pic{width:52px;height:52px}
.thread .pic.round{border-radius:26px}
.thread .m{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.thread .m p:last-child{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unread{width:8px;height:8px;border-radius:50%;background:var(--primary);flex:none}
.bub{max-width:250px;padding:10px 14px;border-radius:16px;font-size:16px;background:var(--lowest);box-shadow:inset 0 0 0 1px var(--ovar);align-self:flex-start;overflow-wrap:anywhere}
.bub.me{background:var(--primary);color:var(--on-primary);box-shadow:none;align-self:flex-end}
.qcard{width:250px;align-self:flex-start;border-radius:16px;background:var(--lowest);box-shadow:inset 0 0 0 1px var(--ovar);padding:12px;display:flex;flex-direction:column;gap:4px;box-sizing:border-box}
.qcard .pic{height:110px;margin-bottom:6px}
.qcard .btn{margin-top:6px}
.composer{display:flex;align-items:center;gap:10px}
.composer>button:first-child{color:var(--sub)}
.composer input{flex:1;min-width:0;height:44px;border-radius:22px;border:1px solid var(--outline);padding:0 16px;font:inherit;font-size:16px;outline:none;color:var(--ink);background:var(--lowest)}
.composer input:focus{border-color:var(--primary)}
.sendb{width:44px;height:44px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;flex:none}
.member{color:#fff;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:4px;background:linear-gradient(rgba(137,52,28,.78),rgba(137,52,28,.78)),url('img/yacht.jpg') center/cover no-repeat}
.member .k{color:var(--inv-p);font-size:10px}
.member .x{color:var(--inv-p);font-size:13px}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--pc);color:var(--on-pc);display:grid;place-items:center;font-size:16px;font-weight:500;flex:none}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:48px 12px}
.toast{position:absolute;left:20px;right:20px;bottom:104px;background:var(--inv-s);color:#fff;border-radius:8px;padding:12px 14px;font-size:13px;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:5}
.toast.show{opacity:1;transform:none}
.bgimg{position:absolute;inset:0;background:center/cover no-repeat;z-index:0}
.bgimg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.04) 38%,rgba(23,8,3,.93) 100%)}
.phone>:not(.bgimg):not(.toast){position:relative;z-index:1}
.phone.on-image .sb{color:#fff}
.phone.on-image .sb i{background:#fff}
.phone.on-image .divider{color:#fff}
.phone.on-image .divider::before,.phone.on-image .divider::after{background:rgba(255,255,255,.35)}
.phone.on-image .btn.ghost{color:#fff}

/* hotspots */
:is(body.hot .phone,.phone.flash) :is([data-go],[data-act],[data-back],[data-toast],[data-tab]){outline:2px solid var(--hot);outline-offset:-1px}
.phone.flash :is([data-go],[data-act],[data-back],[data-toast],[data-tab]){animation:hot .7s ease-out both}
@keyframes hot{from{outline-color:var(--hot)}to{outline-color:transparent}}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- phone-width: run the prototype full-screen ---------- */
@media (max-width:640px){
  .app{display:block;padding:0}
  .stage{height:100%;gap:0}
  .wrap{width:100%!important;height:100%!important}
  .phone{position:relative;width:100%;height:100%;transform:none!important;border-radius:0;box-shadow:none}
  .caption{display:none}
  .navopen-btn{display:flex;position:fixed;z-index:30;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:14px;background:rgba(26,26,26,.88);color:#fff;font-size:12px;font-weight:600}
  .nav{position:fixed;inset:0;z-index:40;border-radius:0;border:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);transform:translateY(100%);transition:transform .25s ease}
  body.navopen .nav{transform:none}

  .nav-head p{width:100%;order:3}

}

<div class="app">

      <div class="brand"><span class="fruit"></span>Percimon</div>

      <div><span class="code" id="capCode"></span> <span id="capName"></span> <span class="sec" id="capSec"></span></div>
      <button class="step" id="next" aria-label="Next screen"></button>
    </div>
  </main>
</div>

<script>
const P={
 chevL:'<path d="m15 18-6-6 6-6"/>',chevR:'<path d="m9 18 6-6-6-6"/>',
 bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
 compass:'<circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-2.12 6.36-6.36 2.12 2.12-6.36 6.36-2.12z"/>',
 clip:'<rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/>',
 msg:'<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
 user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
 plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',
 image:'<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>',
 search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
 sliders:'<path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/>',
 heart:'<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',
 check:'<path d="M20 6 9 17l-5-5"/>',
 camera:'<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>',
 send:'<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
 paperclip:'<path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/>',
 layers:'<path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/>',
 rotate:'<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
 x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
 pin:'<path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>',
 clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>'
};
const ic=(n,s=24,fill='none')=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${fill}" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const TAP='role="button" tabindex="0"';

/* ---------- screen index ---------- */
const FLOWS=[
 ['Onboarding',[['welcome','1.1','Welcome'],['signup','1.2','Sign up'],['signin','1.3','Sign in'],['verify','1.4','Verify'],['taste','1.5','Your taste'],['ready',"1.6","You're in"]]],
 ['Discover',[['home','2.1','Home'],['search','2.2','Search'],['watches','2.3','Category list'],['product','2.4','Product detail'],['service','2.5','Service detail'],['event','2.6','Exclusive event']]],
 ['Ask',[['ask','3.1','Request form'],['review','3.2','Review'],['sent','3.3','Submitted']]],
 ['Requests',[['requests','4.1','Requests list'],['request','4.2','Request detail'],['checkout','4.3','Checkout'],['paid','4.4','Payment confirmed']]],
 ['Chat',[['inbox','5.1','Inbox'],['conversation','5.2','Conversation']]],
 ['Profile',[['profile','6.1','Profile'],['wishlist','6.2','Wishlist'],['preferences','6.3','Preferences']]]
];
const ORDER=FLOWS.flatMap(([s,items])=>items.map(i=>({id:i[0],code:i[1],name:i[2],sec:s})));
const META=Object.fromEntries(ORDER.map(o=>[o.id,o]));

/* ---------- state ---------- */
let S;
function reset(){S={auth:'signup',signinBy:'Email',f:{otp0:'4',otp1:'8',q:'Patek'},taste:new Set(['Watches','Art','Villas','Fine dining']),
 brand:'All',saved:false,rsvp:false,askCat:'',urg:'Flexible',reqTab:'Active',pay:'full',paid:false,newReqs:[],
 msgs:[],read:false,wl:'All',interests:new Set(['Watches','Art','Villas','Fine dining','Yachts']),brands:new Set(),recentCleared:false}}
reset();

/* ---------- building blocks ---------- */
const NOT=w=>`data-toast="${w} isn't in this prototype yet."`;
const topBar=(t,root)=>root?`<div class="topbar"><h1>${t}</h1><button class="circ" ${NOT('Notifications')} aria-label="Notifications">${ic('bell',20)}</button></div>`
 :`<div class="topbar"><button class="circ" data-back aria-label="Back">${ic('chevL',20)}</button><span class="t">${t}</span><span class="sp"></span></div>`;
const btn=(l,type='primary',a='')=>`<button class="btn ${type}" ${a}>${l}</button>`;
const pic=(k,h,r=12,extra='')=>`<div class="pic" aria-hidden="true" style="height:${h}px;border-radius:${r}px;background-image:url('img/${k}.jpg');${extra}"></div>`;
const pill=(l,on,a='',tag='button')=>`<${tag} class="pill ${on?'on':''}" ${a}>${l}</${tag}>`;
const seg=(items,cur,act)=>`<div class="seg">${items.map(x=>{const [l,v]=Array.isArray(x)?x:[x,x];return`<button class="${cur===v?'on':''}" data-act="${act}" data-arg="${v}">${l}</button>`}).join('')}</div>`;
const spill=(l,tone='')=>`<span class="spill ${tone}">${l}</span>`;
const shead=(t,a='',attrs='')=>`<div class="shead"><h3>${t}</h3>${a?`<button class="a" ${attrs}>${a}</button>`:''}</div>`;
const row=(l,v='',a='')=>a?`<button class="row" ${a}><span class="l">${l}</span><span class="v">${v}</span>${ic('chevR',18)}</button>`
 :`<div class="row"><span class="l">${l}</span><span class="v">${v}</span></div>`;
const card=(n,b,p,k,a='')=>`<div class="card" ${TAP} ${a}><div class="pic" aria-hidden="true" style="background-image:url('img/${k}.jpg')"><span class="heart">${ic('heart',16)}</span></div><span class="b">${b}</span><span class="n">${n}</span><span class="p">${p}</span></div>`;
const field=(id,l,ph_,type='text',multi=false)=>`<label class="field" for="${id}">${multi
 ?`<textarea id="${id}" placeholder=" ">${esc(S.f[id])}</textarea>`
 :`<input id="${id}" type="${type}" placeholder=" " value="${esc(S.f[id])}" autocomplete="off">`}<span>${l}</span></label>`;
const kv=(k,v,bold)=>`<div class="hrow between"><span class="${bold?'s16 b500':'s13 sub'}">${k}</span><span class="num ${bold?'s16 b500':'s13 b500'}">${v}</span></div>`;
const tabs=a=>`<nav class="tabbar">${[['home','Discover','compass'],['requests','Requests','clip'],['ask','Ask','plus'],['inbox','Chat','msg'],['profile','Profile','user']].map(([id,l,i])=>
 id==='ask'?`<button class="tab" data-go="ask" aria-label="New request"><span class="askb">${ic('plus')}</span></button>`
 :`<button class="tab ${a===id?'on':''}" data-tab="${id}">${ic(i)}<span>${l}</span></button>`).join('')}</nav>`;
const sso=(l,init,a='')=>`<button class="sso" ${a}><i class="logo" aria-hidden="true">${init}</i>${l}</button>`;
const mask=e=>{e=(e||'').trim();if(!e.includes('@'))return 'n•••@email.com';const [u,d]=e.split('@');return u.slice(0,1)+'•••@'+d};
const eur=n=>'€ '+n.toLocaleString('en-US');
const ONLY='data-toast="Only the Patek request is fully wired in this prototype."';

/* ---------- screens ---------- */
const R={
welcome:()=>({bg:'villa',bottom:true,
 body:`<p class="k onimg">PERCIMON</p><h2 class="h1 onimg">Everything, arranged.</h2><p class="s16 onimg">A private concierge for luxury goods, travel and experiences.</p><div style="height:6px"></div>
 ${btn('Create account','primary','data-act="auth" data-arg="signup" data-go="signup"')}<div class="divider">or continue with</div>
 <div class="ssorow">${sso('Apple','A','data-act="auth" data-arg="signup" data-toast="Signed up with Apple." data-go="taste"')}${sso('Google','G','data-act="auth" data-arg="signup" data-toast="Signed up with Google." data-go="taste"')}</div>
 ${btn('I already have an account','ghost','data-go="signin"')}`}),

signup:()=>({top:topBar('Create account'),tight:true,
 body:`<div class="stack"><h2 class="h2">Create your account</h2><p class="s16 sub">Your concierge is one message away.</p></div>
 ${sso('Continue with Apple','A','data-act="auth" data-arg="signup" data-toast="Signed up with Apple." data-go="taste"')}${sso('Continue with Google','G','data-act="auth" data-arg="signup" data-toast="Signed up with Google." data-go="taste"')}
 <div class="divider">or sign up with email</div>
 ${field('su-name','Full name')}${field('su-email','Email','','email')}${field('su-invite','Invite code (optional)')}`,
 footer:btn('Create account','primary','data-act="auth" data-arg="signup" data-go="verify"')+`<p class="fine">By continuing you accept the Terms and Privacy Policy.</p><button class="linkline" data-go="signin">Already a member? Sign in</button>`}),

signin:()=>{const p=S.signinBy==='Phone';return{top:topBar('Sign in'),tight:true,
 body:`<div class="stack"><h2 class="h2">Welcome back</h2><p class="s16 sub">Sign in the way you joined.</p></div>
 ${sso('Continue with Apple','A','data-toast="Signed in with Apple." data-tab="home"')}${sso('Continue with Google','G','data-toast="Signed in with Google." data-tab="home"')}
 <div class="divider">or with a one-time code</div>
 ${seg(['Email','Phone'],S.signinBy,'signinBy')}
 ${p?field('si-phone','Phone','','tel'):field('si-email','Email','','email')}`,
 footer:btn('Send code','primary','data-act="auth" data-arg="signin" data-go="verify"')+`<button class="linkline" data-go="signup">New to Percimon? Create an account</button>`}},

verify:()=>{const signin=S.auth==='signin';const to=signin&&S.signinBy==='Phone'?'+49 ••• ••• 21':mask(S.f[signin?'si-email':'su-email']);return{top:topBar('Verify'),
 body:`<div class="stack"><h2 class="h2">Enter the code</h2><p class="s16 sub">We sent a 6-digit code to ${esc(to)}</p></div>
 <div class="otp">${[0,1,2,3,4,5].map(i=>`<input id="otp${i}" inputmode="numeric" maxlength="1" placeholder=" " aria-label="Digit ${i+1}" value="${esc(S.f['otp'+i])}">`).join('')}</div>
 <p class="s16 sub" style="text-align:center">0:30</p>
 <button class="s16 b500 pri" style="align-self:center" data-toast="New code sent to ${esc(to)}.">Resend code</button>`,
 footer:signin?btn('Verify','primary','data-toast="Welcome back." data-tab="home"'):btn('Verify','primary','data-go="taste"')}},

taste:()=>({top:topBar('Your taste'),tight:true,
 body:`<div class="prog"><i class="on"></i><i class="on"></i><i></i></div><p class="s13 b500 pri">Step 2 of 3</p>
 <div class="stack"><h2 class="h2">What are you into?</h2><p class="s16 sub">Pick a few. Your concierge will tailor suggestions.</p></div>
 <div class="pills wrap">${['Watches','Jewelry','Fashion','Art','Cars','Private jets','Yachts','Villas','Fine dining','Events','Wellness','Chauffeur'].map(t=>pill(t,S.taste.has(t),`data-act="taste" data-arg="${t}"`)).join('')}</div>
 ${shead('Sizes')}<div class="rows">${row('Clothing','M / 48',NOT('The size picker'))}${row('Shoes','EU 42',NOT('The size picker'))}${row('Ring','54',NOT('The size picker'))}</div>`,
 footer:btn('Continue','primary','data-go="ready"')+btn('Skip for now','ghost','data-go="ready"')}),

ready:()=>({center:true,
 body:`${pic('concierge',104,52,'width:104px')}<h2 class="h2">Welcome to Percimon</h2><p class="s16 sub">Elena is your personal concierge. Message her for anything, any time.</p>${spill('Gold member','dark')}`,

home:()=>({top:topBar('Percimon',true),tab:'home',gap:18,
 body:`<div class="hrow between"><div class="stack g2"><p class="s13 sub">Good evening</p><p class="s20 b500">Welcome back, Nadia</p></div>${spill('Gold member','dark')}</div>
 <button class="search" data-go="search">${ic('search',20)}<span>Search watches, villas, chefs…</span></button>
 <div class="hero" ${TAP} data-go="service" style="background-image:url('img/chalet.jpg')"><p class="k">CURATED</p><p class="s25 b500">Winter in Gstaad</p><p class="s13">Chalets, private ski guides and après dining</p></div>
 ${shead('Categories','All','data-go="watches"')}
 <div class="cats">${[['Watches','watches','watch-steel'],['Travel','','chalet'],['Dining','service','chef'],['Cars','','car']].map(([n,g,k])=>`<button class="cat" ${g?`data-go="${g}"`:`data-toast="${n} isn't wired yet. Try Watches or Dining."`}>${pic(k,64,32,'width:64px')}${n}</button>`).join('')}</div>
 <div class="box tonal hrow" ${TAP} data-go="ask"><div class="grow stack g2"><p class="s16 b500">Can't find it?</p><p class="s13">Ask your concierge for anything.</p></div>${btn('Ask','primary small','tabindex="-1"')}</div>

 <div class="hscroll">${card('Royal Oak 15500','Audemars Piguet','€ 48,000','watch-gold','data-go="product"')}${card('Monaco Yacht Show','Experience','From € 9,500','yacht','data-go="event"')}${card('Kelly 25','Hermès','Price on request','handbag','data-go="product"')}</div>`}),

 ${S.recentCleared?'':`${shead('Recent','Clear','data-act="clearRecent"')}<div class="rows">${row('Patek Philippe Nautilus','','data-go="product"')}${row('Private chef, Mykonos','','data-go="service"')}${row('Monaco Yacht Show','','data-go="event"')}</div>`}
 ${shead('Popular now')}<div class="pills wrap">${['Hermès Kelly','Yacht charter','Michelin dining','Private jet','Ski chalet'].map(t=>pill(t,false,`data-act="setq" data-arg="${t}"`)).join('')}</div>

 <div class="grid">${card('Nautilus 5711/1A','Patek Philippe','Price on request','watch-steel','data-go="product"')}${card('Aquanaut 5167A','Patek Philippe','€ 52,000','watch-diver','data-go="product"')}</div>`}},

 const list=S.brand==='All'?W:W.filter(w=>w[1]===S.brand);

 body:`<div class="pills">${pill('Filters',false,NOT('The filter sheet'))}${pill('Sort: Featured',false,NOT('Sorting'))}${pill('In stock',false,NOT('Stock filtering'))}</div>
 <div class="pills">${['All','Patek Philippe','Rolex','Audemars Piguet'].map(b=>pill(b,S.brand===b,`data-act="brand" data-arg="${b}"`)).join('')}</div>

 <div class="grid">${list.map(w=>card(...w,'data-go="product"')).join('')}</div>`}},

 body:`${pic('watch-steel',300,20)}<div class="dots"><i class="on"></i><i></i><i></i></div>
 <p class="s13 b500 pri">Patek Philippe</p><h2 class="h2">Nautilus 5711/1A</h2><p class="s20 sub">Price on request</p>
 <div class="hrow" style="gap:8px">${spill('Unworn','act')}${spill('2021')}${spill('Full set')}</div>
 ${shead('Details')}<div class="rows">${row('Condition','Unworn')}${row('Year','2021')}${row('Box & papers','Included')}${row('Delivery','5–7 days, insured')}</div>`,

 ${shead('Your booking')}<div class="two">${field('sv-date','Date')}${field('sv-guests','Guests')}</div>`,

 body:`${pic('yacht',210,20)}<div class="hrow" style="gap:8px">${spill('Members only','dark')}${S.rsvp?spill("You're going",'ok')+spill('11 spots left','act'):spill('12 spots left','act')}</div>
 <h2 class="h2">Private viewing at the Monaco Yacht Show</h2><p class="meta">${ic('clock',16)}Sep 24 · Monaco · Gold & Black tiers</p>

 <div class="rows">${row('Date','Wed, Sep 24')}${row('Location','Port Hercule')}${row('Dress code','Smart casual')}${row('Guests','+1 allowed')}</div>`,

 body:`<div class="stack"><h2 class="h2">What can we arrange?</h2><p class="s16 sub">A product, a trip, a table. Your concierge takes it from here.</p></div>
 ${field('ask-req','Your request','','text',true)}
 <p class="label">Category (optional)</p><div class="pills">${['Product','Travel','Dining','Event','Other'].map(c=>pill(c,S.askCat===c,`data-act="askCat" data-arg="${c}"`)).join('')}</div>

 footer:btn('Review request','primary','data-go="review"')}),

};

/* ---------- actions ---------- */
const tog=(set,v)=>set.has(v)?set.delete(v):set.add(v);
const ACT={
 auth:a=>S.auth=a, signinBy:a=>S.signinBy=a, taste:a=>tog(S.taste,a), brand:a=>S.brand=a,
 save:()=>{S.saved=!S.saved;toast(S.saved?'Saved to your wishlist.':'Removed from your wishlist.')},
 rsvp:()=>{S.rsvp=!S.rsvp;toast(S.rsvp?"RSVP confirmed. You're on the list.":'RSVP cancelled.')},
 askCat:a=>S.askCat=S.askCat===a?'':a, urg:a=>S.urg=a, reqTab:a=>S.reqTab=a, pay:a=>S.pay=a,
 paynow:()=>{S.paid=true}, trackStack:()=>{stack=['requests']},
 submit:a=>{if(a&&!S.newReqs.includes(a)&&!a.startsWith('Patek'))S.newReqs.unshift(a)},
 clearRecent:()=>S.recentCleared=true,
 setq:a=>{S.f.q=a},
 wl:a=>S.wl=a, interest:a=>tog(S.interests,a), favBrand:a=>tog(S.brands,a),
 signout:()=>{reset()},
 send:()=>{const el=document.getElementById('msg');const t=(el&&el.value||'').trim();if(!t)return;S.msgs.push({me:true,t});
  setTimeout(()=>{S.msgs.push({me:false,t:"Noted. I'll come back to you shortly."});if(cur==='conversation')render('conversation',true)},1100)}
};

/* ---------- navigation ---------- */
const phone=document.getElementById('phone');
let cur=null,stack=[];
function go(id){if(cur&&id!==cur)stack.push(cur);show(id)}
function back(){show(stack.pop()||'home')}
function show(id){render(id);try{if(location.hash.slice(1)!==id)location.hash=id}catch(e){}}
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(id&&id!==cur&&R[id])render(id)});

function render(id,keepScroll){
 if(!R[id])id='welcome';
 const same=id===cur;const prev=phone.querySelector('.content');const sc=prev?prev.scrollTop:0;
 if(id==='conversation')S.read=true;
 cur=id;const s=R[id]();
 phone.classList.toggle('on-image',!!s.bg);
 phone.innerHTML=`${s.bg?`<div class="bgimg" style="background-image:url('img/${s.bg}.jpg')"></div>`:''}<div class="sb"><span>9:41</span><i></i></div>${s.top||''}<div class="content ${s.center?'center':''} ${s.bottom?'bottom':''} ${s.tight?'tight':''}" ${s.gap?`style="gap:${s.gap}px"`:''}>${s.body}</div>${s.footer?`<div class="footer">${s.footer}</div>`:''}${s.tab?tabs(s.tab):''}<div class="toast" id="toast" role="status" aria-live="polite"></div>`;
 const c=phone.querySelector('.content');
 if(id==='conversation')c.scrollTop=c.scrollHeight;else if(same||keepScroll)c.scrollTop=sc;
 const m=META[id];
 document.getElementById('capCode').textContent=m.code;
 document.getElementById('capName').textContent=m.name;
 document.getElementById('capSec').textContent='· '+m.sec;
 document.querySelectorAll('.scr').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
 document.querySelectorAll('.st').forEach(b=>{let on=false;if(b.dataset.id===id){try{on=!!STATES[id][+b.dataset.i][2](S)}catch(e){}}b.classList.toggle('on',on)});
 if(pt)showToast();
}

let tt,pt=null;
function toast(t){pt=t;showToast()}
function showToast(){const el=document.getElementById('toast');if(!el||!pt)return;el.textContent=pt;requestAnimationFrame(()=>el.classList.add('show'));clearTimeout(tt);tt=setTimeout(()=>{el.classList.remove('show');pt=null},2200)}
function flash(){phone.classList.remove('flash');void phone.offsetWidth;phone.classList.add('flash');setTimeout(()=>phone.classList.remove('flash'),700)}

phone.addEventListener('click',e=>{
 const t=e.target.closest('[data-go],[data-back],[data-act],[data-toast],[data-tab]');
 if(!t){if(!e.target.closest('input,textarea,label'))flash();return}
 const d=t.dataset;
 if(d.act){ACT[d.act](d.arg,t)}
 if(d.toast)toast(d.toast);
 if(d.tab){stack=[];show(d.tab)}
 else if(d.go)go(d.go);
 else if('back' in d)back();
 else if(d.act)render(cur,true);
});
phone.addEventListener('keydown',e=>{
 if(e.target.id==='msg'&&e.key==='Enter'){e.preventDefault();ACT.send();render('conversation');document.getElementById('msg')?.focus();return}
 if((e.key==='Enter'||e.key===' ')&&e.target.getAttribute('role')==='button'){e.preventDefault();e.target.click()}
 if(e.target.id&&e.target.id.startsWith('otp')&&e.key==='Backspace'&&!e.target.value){const p=document.getElementById('otp'+(+e.target.id.slice(3)-1));p?.focus()}
});
phone.addEventListener('input',e=>{
 const el=e.target;if(!el.id||el.id==='msg')return;
 if(el.id.startsWith('otp')){el.value=el.value.replace(/\D/g,'').slice(-1);S.f[el.id]=el.value;if(el.value){const n=document.getElementById('otp'+(+el.id.slice(3)+1));n?.focus()}return}
 S.f[el.id]=el.value;
 if(el.id==='q'){const h=document.getElementById('rq');if(h)h.textContent=`Results for "${el.value}"`}
});

/* ---------- screen states: [label, set state, is active] ---------- */
const OTP=['4','8','2','9','1','5'];
const STATES={
 signup:[['Empty',s=>['su-name','su-email','su-invite'].forEach(k=>s.f[k]=''),s=>!s.f['su-name']],['Filled in',s=>Object.assign(s.f,{'su-name':'Nadia Karimi','su-email':'nadia@email.com','su-invite':'PCM-4821'}),s=>!!s.f['su-name']]],
 signin:[['Email code',s=>{s.signinBy='Email';s.auth='signin'},s=>s.signinBy==='Email'],['Phone code',s=>{s.signinBy='Phone';s.auth='signin'},s=>s.signinBy==='Phone']],
 verify:[['After sign-up',s=>s.auth='signup',s=>s.auth==='signup'],['After sign-in',s=>s.auth='signin',s=>s.auth==='signin'],['Partly entered',s=>OTP.forEach((d,i)=>s.f['otp'+i]=i<2?d:''),s=>!s.f.otp5],['Code complete',s=>OTP.forEach((d,i)=>s.f['otp'+i]=d),s=>!!s.f.otp5]],
 taste:[['Suggested picks',s=>s.taste=new Set(['Watches','Art','Villas','Fine dining']),s=>s.taste.size>0],['Nothing picked',s=>s.taste=new Set(),s=>s.taste.size===0]],
 search:[['With recent searches',s=>s.recentCleared=false,s=>!s.recentCleared],['Recent cleared',s=>s.recentCleared=true,s=>s.recentCleared]],
 watches:[['All brands',s=>s.brand='All',s=>s.brand==='All'],['Filtered by brand',s=>s.brand='Rolex',s=>s.brand!=='All']],
 product:[['Not saved',s=>s.saved=false,s=>!s.saved],['Saved',s=>s.saved=true,s=>s.saved]],
 event:[['Before RSVP',s=>s.rsvp=false,s=>!s.rsvp],['RSVP confirmed',s=>s.rsvp=true,s=>s.rsvp]],
 ask:[['Empty',s=>{['ask-req','ask-budget','ask-date','ask-loc'].forEach(k=>s.f[k]='');s.askCat='';s.urg='Flexible'},s=>!s.f['ask-req']],
  ['Filled in',s=>{Object.assign(s.f,{'ask-req':'A table for 4 at Noma, Friday 14 Nov, around 8pm. Window seat if possible.','ask-budget':'€ 1,000 – 2,000','ask-date':'Fri, 14 Nov','ask-loc':'Copenhagen'});s.askCat='Dining';s.urg='This week'},s=>!!s.f['ask-req']]],
 requests:[['Active',s=>{s.reqTab='Active';s.paid=false},s=>s.reqTab==='Active'&&!s.paid],['Active, after payment',s=>{s.reqTab='Active';s.paid=true},s=>s.reqTab==='Active'&&s.paid],
  ['Completed',s=>s.reqTab='Completed',s=>s.reqTab==='Completed'],['Drafts (empty)',s=>s.reqTab='Drafts',s=>s.reqTab==='Drafts']],
 request:[['Quote sent',s=>s.paid=false,s=>!s.paid],['Paid in full',s=>{s.paid=true;s.pay='full'},s=>s.paid&&s.pay==='full'],['Deposit paid',s=>{s.paid=true;s.pay='deposit'},s=>s.paid&&s.pay==='deposit']],
 checkout:[['Pay in full',s=>s.pay='full',s=>s.pay==='full'],['Deposit 30%',s=>s.pay='deposit',s=>s.pay==='deposit']],
 paid:[['Paid in full',s=>{s.paid=true;s.pay='full'},s=>s.pay==='full'],['Deposit paid',s=>{s.paid=true;s.pay='deposit'},s=>s.pay==='deposit']],
 inbox:[['Unread',s=>s.read=false,s=>!s.read],['All read',s=>s.read=true,s=>s.read]],
 conversation:[['Default',s=>s.msgs=[],s=>!s.msgs.length],['After you reply',s=>s.msgs=[{me:true,t:'Perfect, please go ahead.'},{me:false,t:"Noted. I'll come back to you shortly."}],s=>s.msgs.length>0]],
 wishlist:[['All',s=>{s.wl='All';s.saved=false},s=>s.wl==='All'&&!s.saved],['Products',s=>s.wl='Products',s=>s.wl==='Products'],['Services',s=>s.wl='Services',s=>s.wl==='Services'],['With a new save',s=>{s.wl='All';s.saved=true},s=>s.wl==='All'&&s.saved]],
 preferences:[['Saved picks',s=>{s.interests=new Set(['Watches','Art','Villas','Fine dining','Yachts']);s.brands=new Set()},s=>s.interests.size>0],['Nothing picked',s=>{s.interests=new Set();s.brands=new Set()},s=>s.interests.size===0]]
};
const nStates=Object.values(STATES).reduce((a,v)=>a+v.length,0);

/* ---------- navigator ---------- */
document.getElementById('navMeta').textContent=`Hi-fi prototype · v1.0 · ${ORDER.length} screens · ${nStates} states`;
document.getElementById('list').innerHTML=FLOWS.map(([s,items])=>`<div class="flow"><h4>${s}</h4>${items.map(([id,code,name])=>`<button class="scr" data-id="${id}"><span class="code">${code}</span>${name}</button>${STATES[id]?`<div class="states">${STATES[id].map(([l],i)=>`<button class="st" data-id="${id}" data-i="${i}">${l}</button>`).join('')}</div>`:''}`).join('')}</div>`).join('');
document.getElementById('list').addEventListener('click',e=>{
 const st=e.target.closest('.st'),b=e.target.closest('.scr');
 if(st){STATES[st.dataset.id][+st.dataset.i][1](S);stack=[];if(cur===st.dataset.id)render(cur,true);else show(st.dataset.id)}
 else if(b){stack=[];show(b.dataset.id)}else return;
 document.body.classList.remove('navopen')});
const hot=document.getElementById('hotToggle');
hot.addEventListener('change',()=>{document.body.classList.toggle('hot',hot.checked);try{localStorage.setItem('psm-hot',hot.checked?'1':'0')}catch(e){}});
try{if(localStorage.getItem('psm-hot')==='1'){hot.checked=true;document.body.classList.add('hot')}}catch(e){}
document.getElementById('restart').innerHTML=ic('rotate',16)+'Restart';
document.getElementById('restart').addEventListener('click',()=>{reset();stack=[];show('welcome');document.body.classList.remove('navopen')});
document.getElementById('navOpen').innerHTML=ic('layers',14)+'Screens';
document.getElementById('navOpen').addEventListener('click',()=>document.body.classList.add('navopen'));
document.getElementById('navClose').innerHTML=ic('x',18);
document.getElementById('navClose').addEventListener('click',()=>document.body.classList.remove('navopen'));
const step=d=>{const i=ORDER.findIndex(o=>o.id===cur);const n=ORDER[(i+d+ORDER.length)%ORDER.length];stack=[];show(n.id)};
document.getElementById('prev').innerHTML=ic('chevL',18);document.getElementById('next').innerHTML=ic('chevR',18);
document.getElementById('prev').addEventListener('click',()=>step(-1));document.getElementById('next').addEventListener('click',()=>step(1));
document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea'))return;if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});

/* ---------- fit phone to the stage ---------- */
const stage=document.getElementById('stage'),wrap=document.getElementById('wrap');
function fit(){if(matchMedia('(max-width:640px)').matches){phone.style.transform='';wrap.style.width='';wrap.style.height='';return}
 const r=stage.getBoundingClientRect();const s=Math.min(1,(r.height-90)/812,(r.width-40)/375);
 phone.style.transform=`scale(${s})`;wrap.style.width=375*s+'px';wrap.style.height=812*s+'px'}
addEventListener('resize',fit);fit();

render(R[location.hash.slice(1)]?location.hash.slice(1):'welcome');
</script>

</body>
